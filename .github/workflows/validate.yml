name: Validate collection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogs, learning pages and publication hygiene
        run: python3 scripts/validate_collection.py
      - name: Verify offline bundle and source equivalence
        run: |
          node --test scripts/test_learning_viewer.js
          python3 scripts/test_learning_bundle.py
          python3 scripts/build_learning_guide.py --check
