dth="188" height="78" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="768.5" y="369.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#1d4ed8"><tspan x="768.5" dy="0">Run prompt</tspan></text><text x="768.5" y="400.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#1d4ed8" fill-opacity="0.72"><tspan x="768.5" dy="0">across models</tspan></text></g><g filter="url(#sh)"><rect x="674.5" y="571.5" width="188" height="78" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="768.5" y="604.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#3730a3"><tspan x="768.5" dy="0">Assertions</tspan></text><text x="768.5" y="635.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#3730a3" fill-opacity="0.72"><tspan x="768.5" dy="0">contains, regex, sim</tspan></text></g><g filter="url(#sh)"><rect x="406" y="689" width="188" height="78" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="500" y="722.4" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#0f766e"><tspan x="500" dy="0">Ragas / G-Eval</tspan></text><text x="500" y="752.7" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#0f766e" fill-opacity="0.72"><tspan x="500" dy="0">faithfulness, relevancy</tspan></text></g><g filter="url(#sh)"><rect x="137.5" y="571.5" width="188" height="78" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="231.5" y="604.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#6d28d9"><tspan x="231.5" dy="0">Score table</tspan></text><text x="231.5" y="635.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#6d28d9" fill-opacity="0.72"><tspan x="231.5" dy="0">pass / fail rate</tspan></text></g><g filter="url(#sh)"><rect x="137.5" y="336.5" width="188" height="78" rx="14" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/><text x="231.5" y="369.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#ffffff"><tspan x="231.5" dy="0">Gate CI</tspan></text><text x="231.5" y="400.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.86"><tspan x="231.5" dy="0">block regressions</tspan></text></g><text x="500" y="842" text-anchor="middle" class="caption" font-size="15" font-weight="600" fill="#475467">score prompts on every change</text><rect x="60" y="854" width="880" height="70" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="60" y="854" width="6" height="70" rx="3" fill="#4f46e5"/><text x="82" y="880" text-anchor="start" class="tag" font-size="11" font-weight="800" fill="#3730a3" letter-spacing="0.8" style="text-transform:uppercase">EXAMPLE</text><text x="82" y="906" text-anchor="start" class="example-text" font-size="15" font-weight="600" fill="#344054"><tspan x="82" dy="0">Promptfoo runs 50 cases across GPT-4o vs Claude; Ragas scores RAG faithfulness in CI.</tspan></text></svg></div></template><template id="wpop-4-1"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Recap: Your Eval Harness, Now Automated</h3><div class="analogy"><span class="an-lab">In plain words</span>Running evals by hand is like a chef tasting the soup only when they remember to — a CI gate is the kitchen timer that forces a taste check before every dish leaves the pass.</div><div class="callout info">Before reading on, recall from memory: <strong>in Module 3 you built an eval harness</strong> that runs test cases through a scorer. What two things does the scorer produce for each test case, and what does the harness do with those results? Write your answer before scrolling.</div><p>The harness produces a <button class="term" data-term="scorer">score<span class="i">i</span></button> and a pass/fail <button class="term" data-term="assertion">assertion<span class="i">i</span></button> for each <button class="term" data-term="test-case">test case<span class="i">i</span></button>. It aggregates them into a summary: overall accuracy, average <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button>, and <button class="term" data-term="score-distribution">score distribution<span class="i">i</span></button>. In Module 4 you ran that harness locally and read the results by hand.</p><p>Running evals by hand only happens when someone remembers to do it. A teammate merges a prompt change on Friday. Nobody runs the suite. By Monday your chatbot halluccinates policy details. This module solves that by wiring your harness into <strong>CI/CD</strong> — Continuous Integration / Continuous Delivery. The eval suite runs automatically on every pull request and blocks the merge if scores fall below your thresholds.</p><p>The driving question: <strong>how do you turn a local script into a mandatory quality gate that the whole team must pass?</strong></p></div></template><template id="wpop-4-2"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>What a CI Gate Does and Why</h3><div class="analogy"><span class="an-lab">In plain words</span>A CI gate is like a building inspector who must sign off before a contractor can hand over the keys — no sign-off, no handover, no matter how confident the contractor feels.</div><p>A <button class="term" data-term="ci-gate">CI gate<span class="i">i</span></button> is a pipeline step that runs a check and either lets the pipeline continue or stops it with a non-zero exit code. CI (Continuous Integration) means every code change is automatically built and tested before merging into the main branch. Adding an eval step means every prompt, retrieval, or model change is automatically quality-tested — not just syntax-checked.</p><p>The two numbers you care about are <strong>overall accuracy</strong> (fraction of 50 test cases that pass all assertions) and <strong>faithfulness</strong> (0–1 score measuring whether the answer is grounded in retrieved context, not invented). You set a <button class="term" data-term="threshold">threshold<span class="i">i</span></button> for each: 85% accuracy and 0.8 faithfulness. If either falls below its threshold, the gate fails and the pull request cannot be merged.</p><p>GitHub Actions is the CI platform built into GitHub. You describe your pipeline in a YAML file (plain-text format using indentation to show structure) stored at <code>.github/workflows/eval.yml</code>. GitHub reads that file and runs the steps you describe on a cloud machine every time a pull request is opened or updated.</p><ul><li><strong>Trigger</strong>: the event that starts the pipeline (e.g. a pull request to main).</li><li><strong>Job</strong>: a group of steps that run on the same machine.</li><li><strong>Step</strong>: one shell command or pre-built action inside a job.</li><li><strong>Exit code</strong>: 0 means success; anything else means failure and blocks the merge.</li></ul></div></template><template id="wpop-4-3"><div class="block reveal"><h3>Pull Request → Gate → Merge Flow</h3><div class="map-row"><div class="map-node"><div class="mn-title">Pull Request opened</div><div class="mn-sub">code or prompt change</div></div><div class="map-node"><div class="mn-title">GitHub Actions triggered</div><div class="mn-sub">reads eval.yml</div></div><div class="map-node"><div class="mn-title">Install deps &amp; restore cache</div><div class="mn-sub">dataset cached to save cost</div></div><div class="map-node"><div class="mn-title">Run 50-case eval suite</div><div class="mn-sub">accuracy + faithfulness scored</div></div><div class="map-node"><div class="mn-title">Threshold check</div><div class="mn-sub">accuracy ≥ 85% AND faithfulness ≥ 0.8?</div></div><div class="map-node"><div class="mn-title">Gate passes → merge allowed</div></div><div class="map-node"><div class="mn-title">Gate fails → merge blocked</div><div class="mn-sub">non-zero exit code</div></div></div></div></template><template id="wpop-4-4"><div class="block reveal needs-technical blk-explain"><h3>Secrets and Caching: Two Essentials</h3><div class="analogy"><span class="an-lab">In plain words</span>Storing an API key in a GitHub Secret is like keeping your house key in a lockbox rather than taping it to the front door — the CI machine can retrieve it at runtime without it ever appearing in your code.</div><p>Your eval suite calls an LLM API (Application Programming Interface) to score faithfulness. That call requires an API key, a secret credential you must never commit to your repository. GitHub Secrets is a built-in vault: you paste the key into the repository settings UI once, give it a name like <code>OPENAI_API_KEY</code>. GitHub injects it as an environment variable at runtime. It never appears in logs or in your YAML file.</p><p>The second concern is cost. Running 50 test cases means 50 API calls every time the pipeline triggers. Re-downloading and re-embedding the dataset on every run adds up quickly. GitHub Actions has a built-in <strong>cache</strong> action that saves a folder between runs using a hash key. If the file hasn't changed, the cache is restored instantly and no download or embedding call is made.</p><div class="callout warn">Never hard-code an API key directly in your YAML file, even temporarily. Git history is permanent — a key committed and then deleted is still visible in the commit log and must be rotated immediately.</div></div></template><template id="wpop-4-4-a0"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 1: Trigger, Job, and Secrets</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># .github/workflows/eval.yml</span>
name: Chatbot Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  run-evals:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}</pre></div><p>This is the skeleton of your workflow: it declares when to run, what machine to use, and how to expose your API key safely. Every subsequent step you add will live inside the <code>run-evals</code> job.</p><div class="quiz"><div class="q">Predict: Before revealing: what happens to the value of OPENAI_API_KEY if a contributor forks the repository and opens a pull request from their fork? Will the secret be available to the workflow run?</div><button class="reveal">Reveal</button><div class="answer"><p>No — GitHub does NOT inject repository secrets into workflow runs triggered by pull requests from forks, to prevent secret theft. The eval step will fail with an authentication error. The fix is to require maintainers to run the eval gate manually on fork PRs, or to use GitHub's 'pull_request_target' trigger with caution and explicit approval gates.</p></div></div></div></div></div></template><template id="wpop-4-4-a1"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 2: Install, Cache, and Run the Suite</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code">    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        <span class="tk-k">with</span>:
          path: data/chatbot_eval_dataset.jsonl
          key: eval-dataset-${{ <span class="tk-f">hashFiles</span>(<span class="tk-s">'data/chatbot_eval_dataset.jsonl'</span>) }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval suite
        run: python run_evals.py <span class="tk-c">--output results.json</span></pre></div><p>These four steps check out your code, restore the cached dataset if it hasn't changed, install Python packages, and run your eval harness — producing a <code>results.json</code> file that the next step will read. The cache key is a hash (a fingerprint) of the dataset file itself, so the cache is automatically invalidated whenever the dataset changes.</p><div class="quiz"><div class="q">Predict: if you add a new test case to chatbot_eval_dataset.jsonl and push the change, will the cache be used on the next run, or will the dataset be re-processed? Why?</div><button class="reveal">Reveal</button><div class="answer"><p>The cache will be MISSED. hashFiles('data/chatbot_eval_dataset.jsonl') produces a different fingerprint because the file content changed, so the cache key no longer matches. GitHub will run the step fresh and save a new cache entry under the new key. This is exactly the behaviour you want — new test cases get processed, unchanged datasets are served from cache.</p></div></div></div></div></div></template><template id="wpop-4-4-a2"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 3: Threshold Check That Blocks the Merge</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># check_thresholds.py  (called as a final CI step)</span>
<span class="tk-k">import</span> json, sys

results = json.<span class="tk-f">load</span>(<span class="tk-f">open</span>(<span class="tk-s">"results.json"</span>))
accuracy   = results[<span class="tk-s">"accuracy"</span>]      <span class="tk-c"># e.g. 0.82</span>
faithfulness = results[<span class="tk-s">"faithfulness"</span>] <span class="tk-c"># e.g. 0.91</span>

<span class="tk-k">if</span> accuracy &lt; <span class="tk-n">0.85</span>:
    <span class="tk-k">print</span>(f<span class="tk-s">"FAIL: accuracy {accuracy:.0%} &lt; 85% threshold"</span>)
    sys.<span class="tk-f">exit</span>(<span class="tk-n">1</span>)                        <span class="tk-c"># non-zero exit → gate fails</span>
<span class="tk-k">if</span> faithfulness &lt; <span class="tk-n">0.8</span>:
    <span class="tk-k">print</span>(f<span class="tk-s">"FAIL: faithfulness {faithfulness:.2f} &lt; 0.8 threshold"</span>)
    sys.<span class="tk-f">exit</span>(<span class="tk-n">1</span>)
<span class="tk-k">print</span>(<span class="tk-s">"PASS: all thresholds met"</span>); sys.<span class="tk-f">exit</span>(<span class="tk-n">0</span>)</pre></div><p>This script reads the scores your harness wrote to <code>results.json</code> and calls <code>sys.exit(1)</code> — a non-zero exit code — if either <button class="term" data-term="threshold">threshold<span class="i">i</span></button> is missed. GitHub Actions treats any non-zero exit as a failure, which marks the CI check as failed and prevents the pull request from being merged.</p><div class="quiz"><div class="q">Stop — attempt this before revealing.

Your teammate changes the threshold script so it also checks that answer_relevance ≥ 0.75. The results.json already contains an 'answer_relevance' key. Fill in the missing block below:

```python
relevance = results["answer_relevance"]
# TODO: add the threshold check for relevance
```

Hints: (1) follow the same pattern as the faithfulness check above; (2) the exit code must be non-zero to block the merge.</div><button class="reveal">Reveal</button><div class="answer"><p><pre class="code">relevance = results["answer_relevance"]
if relevance &lt; 0.75:                                   # ← CHANGED: new metric + threshold
    print(f"FAIL: answer_relevance {relevance:.2f} &lt; 0.75 threshold")  # ← CHANGED
    sys.exit(1)                                        # same pattern — non-zero blocks merge</pre></p><p>Changed lines: the condition uses 'relevance' and 0.75 (not faithfulness/0.8). Everything else — reading from results, printing a message, calling sys.exit(1) — is identical to the faithfulness block. The crux is knowing that sys.exit(1) is what actually triggers the gate failure.</p></div></div></div></div></div></template><template id="wpop-4-5"><div class="block reveal"><h3>How This Breaks — and How to Verify</h3><div class="callout warn"><h3>Common failure modes in practice</h3><ul><li><strong>Threshold set too tight on day one.</strong> If you set 95% accuracy before your suite is stable, every noisy API response fails the gate. The team learns to ignore or bypass it. Start at your current baseline minus a small buffer (e.g. 88% → 85% threshold) and tighten over time.</li><li><strong>Secret not injected → silent auth failure.</strong> The eval step exits with an authentication error. If your threshold script never runs, the job may still show green. Always add a step that explicitly checks <code>results.json</code> exists before the threshold script runs.</li><li><strong>Stale cache hides </strong><button class="term" data-term="test-set-rot">test-set rot<span class="i">i</span></button><strong>.</strong> If the dataset never changes, the cache is always hit. You never notice that your test cases have drifted out of alignment with real user queries. Schedule a monthly cache-busting run to force a fresh dataset pull and review.</li><li><strong>Regression masked by averaging.</strong> Overall accuracy of 86% can hide a cluster of cases where faithfulness collapsed to 0.3. Always check the <button class="term" data-term="score-distribution">score distribution<span class="i">i</span></button> in the run artifacts, not just the headline numbers.</li></ul><h3>Verifying an AI-generated workflow YAML</h3><ol><li>Check that <code>secrets.*</code> is used for every credential. Search the file for any hard-coded string that looks like a key (starts with 'sk-' or similar).</li><li>Confirm the cache <code>key:</code> uses <code>hashFiles()</code> on the actual dataset path, not a static string. A static key never invalidates.</li><li>Run the workflow on a branch where accuracy is below threshold. Verify the job shows red, not green — this is the only way to confirm the gate actually blocks.</li><li>Check that <code>sys.exit(1)</code> (or equivalent) is called on failure. An AI might generate a script that prints 'FAIL' but exits 0, which GitHub treats as success.</li></ol><p>With your gate wired and verified, the next module shows you how to close the loop. Read production signals back into your eval suite so thresholds stay calibrated as real user behaviour evolves.</p></div></div></template><template id="wpop-5-0"><p>Walk step by step through a failed chatbot case — wrong retrieval chunk → hallucinated policy → scorer reasoning — to build a repeatable debugging workflow, then learn the four pitfalls (flaky LLM judges, data leakage, over-indexing on one metric, and test-set rot) that silently corrupt eval suites and how to guard against each one.</p><p>A step-by-step debugging workflow for failed chatbot evals, plus the four silent pitfalls that corrupt eval suites over time.</p><div class="po-analogy"><b>In plain words —</b> Debugging an eval failure is like rewinding a security camera: you trace each step backward until you find where things went wrong.</div><p><b>Why this matters:</b> Gives you a repeatable process to pinpoint whether a failure is in retrieval, generation, or scoring — and guards your eval suite against the mistakes that make scores meaningless.</p><h4>After this you'll be able to</h4><ul><li>After this you'll be able to inspect a failed trace and identify whether the root cause is retrieval, generation, or scoring.</li><li>After this you'll be able to spot and fix a flaky LLM judge by adjusting temperature, prompt, or switching to a deterministic scorer.</li><li>After this you'll be able to detect data leakage and test-set rot in an existing eval suite and describe the corrective action.</li><li>After this you'll be able to close the feedback loop by adding a new test case that guards against the regression you just debugged.</li></ul><h4>Retrieval Evaluation</h4><div class="po-visual"><svg class="viz-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retrieval Evaluation" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>.viz-svg{color-scheme: light;
  --ink:#101828;        
  --kicker:#667085;

  --annotation:#475467; 
  --caption:#475467;
  --panel:#ffffff;
  --hairline:#e6eaf0;
  --line:#94a3b8;}.viz-svg .title{font-size:34px;font-weight:800;fill:var(--ink);letter-spacing:-.4px}.viz-svg .kicker{font-size:13px;font-weight:700;fill:var(--kicker);letter-spacing:1.4px;text-transform:uppercase}.viz-svg .label{font-size:19px;font-weight:700;fill:var(--label)}.viz-svg .label-on{font-size:19px;font-weight:700;fill:#ffffff}.viz-svg .sub{font-size:13px;font-weight:600;fill:var(--annotation)}.viz-svg .sub-on{font-size:13px;font-weight:600;fill:#ffffff;fill-opacity:.86}.viz-svg .annotation{font-size:13px;font-weight:600;fill:var(--annotation)}.viz-svg .caption{font-size:15px;font-weight:600;fill:var(--caption)}.viz-svg .tag{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.viz-svg .example-text{font-size:15px;font-weight:600;fill:#344054}.viz-svg .conn{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.viz-svg .conn-dashed{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:2 7}.viz-svg .node{rx:14}</style><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#0b1220" flood-opacity="0.08"/></filter></defs><rect x="14" y="14" width="972" height="972" rx="22" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><text x="60" y="74" text-anchor="start" class="title" font-size="34" font-weight="800" fill="#101828">Retrieval Evaluation</text><text x="60" y="104" text-anchor="start" class="kicker" font-size="13" font-weight="700" fill="#667085" letter-spacing="1.4" style="text-transform:uppercase">RAG TOOLING</text><line x1="60" y1="124" x2="940" y2="124" stroke="#e6eaf0" stroke-width="1.5"/><rect x="60" y="166" width="422" height="648" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><rect x="60" y="166" width="422" height="56" rx="16" fill="#0d9488"/><rect x="60" y="206" width="422" height="16" fill="#0d9488"/><text x="271" y="198.2" text-anchor="middle" class="label" font-size="20" font-weight="800" fill="#ffffff"><tspan x="271" dy="0">Non-LLM metrics</tspan></text><circle cx="84" cy="363" r="5" fill="#0d9488"/><text x="100" y="356.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">Context recall</tspan></text><text x="100" y="404" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">did we find it?</text><circle cx="84" cy="461" r="5" fill="#0d9488"/><text x="100" y="454.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">Precision @ k</tspan></text><text x="100" y="502" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">hits in top-k</text><circle cx="84" cy="559" r="5" fill="#0d9488"/><text x="100" y="552.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">MRR / nDCG</tspan></text><text x="100" y="600" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">rank-aware order</text><circle cx="84" cy="657" r="5" fill="#0d9488"/><text x="100" y="650.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">BLEU / ROUGE</tspan></text><text x="100" y="698" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">lexical overlap</text><rect x="518" y="166" width="422" height="648" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="518" y="166" width="422" height="56" rx="16" fill="#4f46e5"/><rect x="518" y="206" width="422" height="16" fill="#4f46e5"/><text x="729" y="198.2" text-anchor="middle" class="label" font-size="20" font-weight="800" fill="#ffffff"><tspan x="729" dy="0">LLM-as-judge</tspan></text><circle cx="542" cy="363" r="5" fill="#4f46e5"/><text x="558" y="356.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Faithfulness</tspan></text><text x="558" y="404" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">answer grounded in ctx</text><circle cx="542" cy="461" r="5" fill="#4f46e5"/><text x="558" y="454.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Answer relevance</tspan></text><text x="558" y="502" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">on-topic vs query</text><circle cx="542" cy="559" r="5" fill="#4f46e5"/><text x="558" y="552.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Context relevance</tspan></text><text x="558" y="600" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">chunks actually useful</text><circle cx="542" cy="657" r="5" fill="#4f46e5"/><text x="558" y="650.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">RAGAS / agent goal</tspan></text><text x="558" y="698" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">automated eval suite</text><circle cx="500" cy="490" r="22" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><text x="500" y="495" text-anchor="middle" class="annotation" font-size="14" font-weight="800" fill="#667085">VS</text><text x="500" y="842" text-anchor="middle" class="caption" font-size="15" font-weight="600" fill="#475467">score retrieval, not just answers</text><rect x="60" y="854" width="880" height="70" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="60" y="854" width="6" height="70" rx="3" fill="#4f46e5"/><text x="82" y="880" text-anchor="start" class="tag" font-size="11" font-weight="800" fill="#3730a3" letter-spacing="0.8" style="text-transform:uppercase">EXAMPLE</text><text x="82" y="906" text-anchor="start" class="example-text" font-size="15" font-weight="600" fill="#344054"><tspan x="82" dy="0">RAGAS flags a confident answer as unfaithful because none of the retrieved chunks support it.</tspan></text></svg></div></template><template id="wpop-5-1"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Recap: What a Trace Tells You</h3><div class="analogy"><span class="an-lab">In plain words</span>A trace is to a failed eval what a flight data recorder is to a crash investigation: you replay every step in order instead of guessing what went wrong mid-air.</div><div class="callout info">Before reading on, predict from memory: in module 4 you learned about a <button class="term" data-term="trace">trace<span class="i">i</span></button>. What does a trace record? Why open it first when an eval fails? Write your answer before continuing.</div><p>A <button class="term" data-term="trace">trace<span class="i">i</span></button> is a timestamped log of every step your system took for one request.</p><p>It records the query, retrieved chunks, prompt sent to the model, and final answer.</p><p>Think of a trace like a flight data recorder: replay it step by step instead of guessing what went wrong.</p><p>In this module you will walk through a real chatbot failure, pinpoint its root cause, and build a guard against regression.</p><p>The driving question: when your chatbot fails, do you blame retrieval, the language model, or your scorer — and what do you do next?</p><div class="keyterms"><button class="term-chip" data-term="trace">Trace<span class="i">i</span></button><button class="term-chip" data-term="eval">Eval (Evaluation)<span class="i">i</span></button></div></div></template><template id="wpop-5-2"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Three-Layer Debugging: Retrieval, Generation, Scoring</h3><div class="analogy"><span class="an-lab">In plain words</span>Debugging a RAG failure is like a doctor ruling out causes in order — check the test results (retrieval) before blaming the diagnosis (generation) before questioning the lab equipment (scoring).</div><p>Every RAG (Retrieval-Augmented Generation — a system that fetches documents before answering) chatbot failure lives in exactly one of three layers, and the fix is different for each one.</p><p>The first layer is <strong>retrieval</strong>: the system fetched the wrong document chunk, so the model never had the right information to begin with.</p><p>The second layer is <strong>generation</strong>: the right chunk was retrieved, but the model still produced a wrong or fabricated answer — a <button class="term" data-term="hallucination">hallucination<span class="i">i</span></button> (an invented fact not supported by the source).</p><p>The third layer is <strong>scoring</strong>: the answer was actually fine, but your <button class="term" data-term="scorer">scorer<span class="i">i</span></button> (the component that grades the answer) marked it wrong — a false alarm from a flaky <button class="term" data-term="llm-judge">LLM judge<span class="i">i</span></button>.</p><p>You always inspect the layers in order — retrieval first, then generation, then scoring — because a retrieval bug makes every downstream layer look broken even when it is not.</p><ul><li>Retrieval bug → wrong chunk in the trace → fix the index or query</li><li>Generation bug → right chunk, wrong answer → fix the prompt or add a faithfulness assertion</li><li>Scoring bug → right answer, wrong score → fix the judge prompt or switch to a deterministic scorer</li></ul><div class="keyterms"><button class="term-chip" data-term="trace">Trace<span class="i">i</span></button><button class="term-chip" data-term="hallucination">Hallucination<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="llm-judge">LLM Judge<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button></div></div></template><template id="wpop-5-2-a0"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 1 — Inspect a Trace Programmatically</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># Simulated trace object returned by your eval harness</span>
trace = {
    <span class="tk-s">"query"</span>: <span class="tk-s">"What is the return window for electronics?"</span>,
    <span class="tk-s">"retrieved_chunks"</span>: [
        {<span class="tk-s">"id"</span>: <span class="tk-n">47</span>, <span class="tk-s">"text"</span>: <span class="tk-s">"Electronics may be returned within 60 days "</span>
                           <span class="tk-s">"if purchased during a promotional period."</span>},
    ],
    <span class="tk-s">"answer"</span>: <span class="tk-s">"You have 60 days to return any electronics."</span>,
    <span class="tk-s">"score"</span>: <span class="tk-n">0.0</span>,
    <span class="tk-s">"judge_reasoning"</span>: <span class="tk-s">"Answer contradicts expected policy of 30 days."</span>,
}

<span class="tk-c"># Layer 1 — retrieval check</span>
<span class="tk-k">for</span> chunk <span class="tk-k">in</span> trace[<span class="tk-s">"retrieved_chunks"</span>]:
    <span class="tk-k">print</span>(<span class="tk-s">"Chunk:"</span>, chunk[<span class="tk-s">"text"</span>][:<span class="tk-n">60</span>])</pre></div><p>This snippet shows the simplest possible trace inspection: loop over the retrieved chunks and print the first 60 characters of each one.</p><p>When you run this, you immediately see the promotional-period text — confirming the retrieval bug before you even look at the answer.</p><div class="quiz"><div class="q">Predict: Before running: what will the print statement output? Write the exact text you expect to see.</div><button class="reveal">Reveal</button><div class="answer"><p>Output: Chunk: Electronics may be returned within 60 days if purchased during</p><p>The chunk text is sliced at 60 characters, revealing the promotional-period wording. This is the smoking gun: the wrong document was fetched.</p></div></div></div></div><div class="keyterms"><button class="term-chip" data-term="trace">Trace<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button></div></div></template><template id="wpop-5-2-a1"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 2 — Fix Retrieval and Add a Guard Test</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># --- Fix: filter out promotional chunks at query time ---</span>
<span class="tk-k">def</span> <span class="tk-f">retrieve</span>(query, chunks, exclude_tags=<span class="tk-k">None</span>):
    exclude_tags = exclude_tags <span class="tk-k">or</span> []
    <span class="tk-k">return</span> [
        c <span class="tk-k">for</span> c <span class="tk-k">in</span> chunks
        <span class="tk-k">if</span> <span class="tk-k">not</span> <span class="tk-t">any</span>(tag <span class="tk-k">in</span> c.<span class="tk-f">get</span>(<span class="tk-s">"tags"</span>, []) <span class="tk-k">for</span> tag <span class="tk-k">in</span> exclude_tags)
    ]

<span class="tk-c"># --- Guard: new regression test case ---</span>
new_test = {
    <span class="tk-s">"query"</span>: <span class="tk-s">"What is the return window for electronics?"</span>,
    <span class="tk-s">"expected"</span>: <span class="tk-s">"30 days"</span>,          <span class="tk-c"># pinned correct answer</span>
    <span class="tk-s">"must_not_contain"</span>: <span class="tk-s">"60 days"</span>,  <span class="tk-c"># explicit negative assertion</span>
}

<span class="tk-k">def</span> <span class="tk-f">run_guard</span>(test, answer):
    passed = (test[<span class="tk-s">"expected"</span>] <span class="tk-k">in</span> answer <span class="tk-k">and</span>
              test[<span class="tk-s">"must_not_contain"</span>] <span class="tk-k">not</span> <span class="tk-k">in</span> answer)
    <span class="tk-k">return</span> <span class="tk-s">"PASS"</span> <span class="tk-k">if</span> passed <span class="tk-k">else</span> <span class="tk-s">"FAIL"</span></pre></div><p>Stage 2 shows two things together: the retrieval fix (a tag-based filter) and the new guard test case that will catch this regression forever.</p><p>The <code>must_not_contain</code> field is a negative <button class="term" data-term="assertion">assertion<span class="i">i</span></button> — it fails if the forbidden string appears in the answer, giving you a deterministic (rule-based, not AI-graded) safety net alongside your LLM judge.</p><div class="quiz"><div class="q">Stop — attempt this before revealing.
Hint 1: run_guard receives the new_test dict and a candidate answer string.
Hint 2: what does run_guard return if answer = "You have 30 days to return electronics"?
Write your prediction, then reveal.</div><button class="reveal">Reveal</button><div class="answer"><p>run_guard returns "PASS".</p><p>"30 days" IS in the answer (expected check passes) and "60 days" is NOT in the answer (must_not_contain check passes).</p><p>Changed lines vs Stage 1: added the retrieve() filter function and the run_guard() assertion — these are the two new ideas this module introduces.</p></div></div></div></div><div class="keyterms"><button class="term-chip" data-term="assertion">Assertion<span class="i">i</span></button><button class="term-chip" data-term="regression">Regression<span class="i">i</span></button><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="llm-judge">LLM Judge<span class="i">i</span></button></div></div></template><template id="wpop-5-3"><div class="block reveal"><h3>Walking a Real Failure: Wrong Policy Answer</h3><div class="walk"><div class="step"><div class="n"></div><div><strong>Step 1 — Read the failure report</strong><p>A customer asks: "What is the return window for electronics?" The chatbot answers: "You have 60 days to return any electronics." Your eval suite flags this as a <button class="term" data-term="regression">regression<span class="i">i</span></button> — a failure that was passing before — because the correct policy is 30 days.</p></div></div><div class="step"><div class="n"></div><div><strong>Step 2 — Open the trace and check retrieval</strong><p>Open the <button class="term" data-term="trace">trace<span class="i">i</span></button> for this request. Look at the "retrieved_chunks" field. You see chunk ID 47: "Electronics may be returned within 60 days if purchased during a promotional period." That is the wrong chunk — it describes a seasonal promotion, not the standard policy.</p><div class="callout warn">Root cause confirmed at layer 1 (retrieval): the retriever fetched a promotional-period chunk instead of the standard-policy chunk. The model had no chance of answering correctly.</div></div></div><div class="step"><div class="n"></div><div><strong>Step 3 — Verify generation was not also at fault</strong><p>Even though retrieval is the root cause, check whether the model faithfully quoted the chunk or added extra invention. The answer "60 days" matches the chunk exactly — so the model was <button class="term" data-term="faithfulness">faithful<span class="i">i</span></button> to its (wrong) source. Generation is not an additional bug here.</p></div></div><div class="step"><div class="n"></div><div><strong>Step 4 — Check the scorer's reasoning</strong><p>Look at the <button class="term" data-term="llm-judge">LLM judge<span class="i">i</span></button>'s reasoning field in the trace. It says: "The answer contradicts the expected policy of 30 days — score: 0." The scorer caught the error correctly, so layer 3 is healthy.</p></div></div><div class="step"><div class="n"></div><div><strong>Step 5 — Fix and add a guard</strong><p>Fix the retriever (add a metadata filter so promotional chunks are excluded from standard-policy queries), then add a new <button class="term" data-term="test-case">test case<span class="i">i</span></button> to your <button class="term" data-term="dataset">dataset<span class="i">i</span></button> that pins this exact query to the 30-day answer. This closes the feedback loop so the same regression cannot silently reappear.</p></div></div></div><div class="keyterms"><button class="term-chip" data-term="trace">Trace<span class="i">i</span></button><button class="term-chip" data-term="regression">Regression<span class="i">i</span></button><button class="term-chip" data-term="hallucination">Hallucination<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="llm-judge">LLM Judge<span class="i">i</span></button><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button></div></div></template><template id="wpop-5-4"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Four Pitfalls That Silently Corrupt Eval Suites</h3><div class="analogy"><span class="an-lab">In plain words</span>An eval suite with these four pitfalls is like a smoke detector with a dead battery — it looks fine on the wall, but it will not save you when the fire starts.</div><p>Even a well-built eval suite can fail silently in four ways. Your pipeline still runs and scores appear, but numbers no longer mean what you think.</p><h3>1. Flaky LLM Judges</h3><p>A <button class="term" data-term="llm-judge">flaky LLM judge<span class="i">i</span></button> gives different scores for the same input on different runs.</p><p>It's like a human grader marking 7/10 on Monday and 5/10 on Friday for the same essay.</p><p>The symptom: <button class="term" data-term="score-distribution">score distribution<span class="i">i</span></button> shifts between runs even when you changed nothing.</p><p>Fix it: set the judge's temperature to 0 (deterministic), tighten the rubric prompt, or switch to rule-based <button class="term" data-term="exact-match">exact match<span class="i">i</span></button> or <button class="term" data-term="semantic-similarity">semantic similarity<span class="i">i</span></button> scoring.</p><h3>2. Data Leakage</h3><p>Data leakage happens when test cases overlap with data your model or retriever was trained on.</p><p>The system looks like it generalizes when it is really just memorizing.</p><p>The symptom: suspiciously high eval scores but poor performance on real user queries.</p><p>Fix it: keep a held-out test set never used during tuning. Hash test inputs to detect duplicates.</p><h3>3. Over-Indexing on One Metric</h3><p>Optimizing for a single metric — say, <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button> — can cause the system to ace that score while failing on <button class="term" data-term="answer-relevance">answer relevance<span class="i">i</span></button> or helpfulness.</p><p>A model that always responds "I cannot answer that" scores perfectly on faithfulness but is useless.</p><p>Guard against this: track at least three metrics together. Set a minimum floor on each one.</p><h3>4. Test-Set Rot</h3><p>Test-set rot happens when your <button class="term" data-term="dataset">dataset<span class="i">i</span></button> goes stale. Test cases were written for last year's product.</p><p>They no longer reflect what real users actually ask today.</p><p>The symptom: a suite that passes confidently while production complaints pile up.</p><p>Fix it: schedule quarterly reviews. Add cases from recent support tickets. Retire cases for deprecated features. Tag each case with its date.</p><div class="keyterms"><button class="term-chip" data-term="llm-judge">LLM Judge<span class="i">i</span></button><button class="term-chip" data-term="score-distribution">Score Distribution<span class="i">i</span></button><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="semantic-similarity">Semantic Similarity<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="data-leakage">Data Leakage<span class="i">i</span></button><button class="term-chip" data-term="test-set-rot">Test-Set Rot<span class="i">i</span></button></div></div></template><template id="wpop-5-5"><div class="block reveal"><h3>Pitfall vs. Detectability Map</h3><div class="viz" data-viz="scatter"><p class="viz-cap">Each point is a failure mode. Click 'Easy to spot' to see which failures surface quickly in a trace; click 'Hard to spot' to see which ones hide behind healthy-looking scores. Points near 'Hard to spot' need the most active guarding.</p><div class="viz-body"></div><script type="application/json" class="viz-data">{"points":[{"label":"Flaky Judge","x":30,"y":75,"group":"scoring"},{"label":"Data Leakage","x":70,"y":20,"group":"data"},{"label":"One-Metric Trap","x":55,"y":60,"group":"metrics"},{"label":"Test-Set Rot","x":80,"y":30,"group":"data"},{"label":"Retrieval Bug","x":20,"y":85,"group":"retrieval"},{"label":"Hallucination","x":40,"y":65,"group":"generation"},{"label":"Silent Drift","x":85,"y":15,"group":"data"}],"queries":[{"label":"Easy to spot","x":20,"y":80},{"label":"Hard to spot","x":80,"y":20}]}</script></div></div></template><template id="wpop-5-6"><div class="block reveal"><h3>Closing the Loop: Your Debugging Checklist</h3><div class="callout good"><p>Every time an eval fails, run through this checklist in order before touching any code.</p><p>It keeps you from fixing the wrong layer.</p><ol><li>Open the <button class="term" data-term="trace">trace<span class="i">i</span></button>. Read retrieved chunks before reading the answer.</li><li>Layer 1 check: is the right chunk present? If not, the bug is in retrieval.</li><li>Layer 2 check: does the answer match the chunk? If not, the bug is in generation.</li><li>Layer 3 check: read the judge's reasoning field. Is the score justified? If not, the bug is in scoring.</li><li>Fix the root-cause layer. Add a new <button class="term" data-term="test-case">test case<span class="i">i</span></button> with a negative assertion to guard the regression.</li><li>Check for the four pitfalls: flaky judge, data leakage, one-metric trap, test-set rot.</li></ol><p>When verifying AI-generated eval code, confirm: (a) judge temperature is 0, (b) test set has no overlap with fine-tuning data, (c) at least three metrics have active <button class="term" data-term="threshold">thresholds<span class="i">i</span></button> in your <button class="term" data-term="ci-gate">CI gate<span class="i">i</span></button>.</p><p>Also confirm: (d) every test case carries a date tag so you can spot stale ones.</p><p>You have now completed the full eval loop: from defining what to measure (module 1) through building the harness (module 3), reading results (module 4), gating releases (module 5), and debugging failures (this module).</p><p>The next step: apply this workflow to your own system. Start with the single most-complained-about query in your production logs.</p><p>Trace it through all three layers.</p></div><div class="keyterms"><button class="term-chip" data-term="trace">Trace<span class="i">i</span></button><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="threshold">Threshold<span class="i">i</span></button><button class="term-chip" data-term="ci-gate">CI Gate<span class="i">i</span></button><button class="term-chip" data-term="regression">Regression<span class="i">i</span></button><button class="term-chip" data-term="llm-judge">LLM Judge<span class="i">i</span></button><button class="term-chip" data-term="data-leakage">Data Leakage<span class="i">i</span></button><button class="term-chip" data-term="test-set-rot">Test-Set Rot<span class="i">i</span></button></div></div></template><template id="wpop-6-0"><div class="eyebrow">Putting it together</div><h2>Synthesis</h2><p>Before you scroll back, close your notes and sketch the six-step build order from memory — what did you do first, and what had to be true before you could gate anything in CI?<br>Use exact-match or semantic-similarity when the answer space is narrow; reach for a faithfulness or LLM judge only when meaning, not wording, is what the product guarantees.</p><h3>Suggested build order</h3><div class="walk"><div class="step"><div class="n"></div><div><strong>What LLM Evals Actually Measure</strong></div></div><div class="step"><div class="n"></div><div><strong>Define Metrics and Test Cases</strong></div></div><div class="step"><div class="n"></div><div><strong>Build the Eval Harness</strong></div></div><div class="step"><div class="n"></div><div><strong>Run Evals Locally and Read Results</strong></div></div><div class="step"><div class="n"></div><div><strong>Gate Evals in CI/CD</strong></div></div><div class="step"><div class="n"></div><div><strong>Debug Failures and Avoid Common Pitfalls</strong></div></div></div><h3>Decision checklist</h3><ul class="checklist"><li>Mapped every product requirement to one of the four eval categories (accuracy, faithfulness, relevance, latency)</li><li>Chose the right metric for each requirement and documented why the alternatives are weaker</li><li>Wrote test cases with all four required fields: input, context, expected output, scorer</li><li>Built a dataset that covers happy paths, edge cases, and escalation scenarios</li><li>Decided between promptfoo (YAML-first, CLI) and DeepEval (pytest-native, Python SDK) based on your existing stack</li><li>Verified the harness config has correct provider, scorer, and dataset references</li><li>Ran the full suite locally and read the pass/fail table and score distribution</li><li>Opened at least one failing trace and identified the root cause layer (retrieval, generation, or scoring)</li><li>Set accuracy and faithfulness thresholds that reflect real product risk</li><li>Wired the eval suite as a required CI step that blocks merges on threshold failure</li><li>Stored API keys as secrets and cached the dataset in CI</li><li>Checked the eval suite for data leakage and test-set rot</li><li>Added a new test case to guard against each regression you debugged</li></ul><div class="capstone"><strong>Try it:</strong> <p>You are building a customer-support chatbot for a health-insurance company. The bot answers questions about plan coverage using a retrieval-augmented generation (RAG) pipeline — it fetches relevant policy clauses and then generates an answer.</p><p>Your task: design and document a complete eval setup for this bot from scratch.</p><p>Deliverables (write each as a clearly labeled section):</p><ol><li>Eval category mapping</li></ol><ul><li>List the four eval categories.</li><li>For each one, write one concrete product requirement this insurance bot must meet and name the metric you would use to test it.</li></ul><ol><li>Dataset design</li></ol><ul><li>Describe the structure of one complete test case (all required fields, with realistic values for this domain).</li><li>Name three distinct scenario types your 50-case dataset must include and give one example input for each.</li></ul><ol><li>Harness choice and config sketch</li></ol><ul><li>State which framework you would choose (promptfoo or DeepEval) and give exactly three reasons tied to your team's context (you are a Python shop with an existing pytest suite).</li><li>Write a plain-text sketch (no code fences) of the key config elements: provider, dataset reference, and at least two scorers with their thresholds.</li></ul><ol><li>CI gate spec</li></ol><ul><li>Describe the CI step: what command runs, what thresholds block a merge, and how API keys are handled.</li></ul><ol><li>Pitfall audit</li></ol><ul><li>Identify one way data leakage could occur in this insurance-bot eval suite and state the corrective action.</li><li>Identify one sign that your LLM judge is flaky and state how you would fix it.</li></ul><p>You've nailed it when:</p><ul><li>Every eval category has a distinct, insurance-specific product requirement and a correctly matched metric.</li><li>The test case includes all four required fields with domain-realistic values.</li><li>The framework choice is justified with three criteria that reference the Python/pytest context, not generic preferences.</li><li>The CI gate names a specific threshold value for at least two metrics and explains how secrets are stored.</li><li>Both pitfalls are correctly identified with a concrete, actionable fix. Next: This lesson can't protect you when your retrieval layer itself is the problem — the next lesson covers how to evaluate and improve the chunking, embedding, and re-ranking steps that feed your LLM before generation even begins.</li></ul></div></template><template id="wpop-7-0"><div class="qprompt"><p>A product manager says: 'The bot must only tell users things that are actually written in the policy document — no made-up details.' Which eval metric directly tests this requirement?</p></div><button class="qopt" data-ok="0"><b class="qL">A.</b> Exact match</button><button class="qopt" data-ok="1"><b class="qL">B.</b> Faithfulness</button><button class="qopt" data-ok="0"><b class="qL">C.</b> Answer relevance</button><button class="qopt" data-ok="0"><b class="qL">D.</b> Latency threshold</button><div class="qfb"></div><div class="qfb-src" hidden><p>Faithfulness checks whether every claim in the output is grounded in the retrieved source — it is the metric built for 'no made-up details.' Exact match only passes if the wording is identical, which is too strict for natural language answers. Answer relevance checks whether the response addresses the question, not whether its facts are sourced. Latency threshold measures speed, not factual grounding.</p></div></template><template id="wpop-7-1"><div class="qprompt"><p>Your team already has a large pytest suite and all your tooling is Python. You need to add LLM evals. Which framework fits your stack, and what is the decisive reason?</p></div><button class="qopt" data-ok="0"><b class="qL">A.</b> promptfoo, because YAML configs are easier to read than Python</button><button class="qopt" data-ok="1"><b class="qL">B.</b> DeepEval, because it is pytest-native and slots directly into your existing Python test suite</button><button class="qopt" data-ok="0"><b class="qL">C.</b> promptfoo, because it supports more provider adapters than DeepEval</button><button class="qopt" data-ok="0"><b class="qL">D.</b> DeepEval, because it runs faster on the CLI than promptfoo</button><div class="qfb"></div><div class="qfb-src" hidden><p>DeepEval is the right fit here because it is pytest-native — your existing pytest infrastructure, fixtures, and CI config all work without translation. promptfoo's YAML-first, CLI-driven design is a strength for teams without a Python test suite, not a Python shop. The distractor about provider adapters is not a documented decisive difference. DeepEval's speed advantage on the CLI is not an established fact and is not the reason to choose it.</p></div></template><template id="wpop-7-2"><div class="qprompt"><p>Read this CI workflow fragment:</p><p>if eval_score &lt; threshold:</p><p>sys.exit(1)</p><p>The faithfulness threshold is set to 0.95 on a dataset of 50 diverse real-world cases. What is the most likely practical problem?</p></div><button class="qopt" data-ok="0"><b class="qL">A.</b> sys.exit(1) is the wrong exit code for CI failure</button><button class="qopt" data-ok="1"><b class="qL">B.</b> The threshold is too high and will block nearly every merge, even when quality is acceptable</button><button class="qopt" data-ok="0"><b class="qL">C.</b> The dataset is too small to use a threshold at all</button><button class="qopt" data-ok="0"><b class="qL">D.</b> Faithfulness cannot be used as a CI gate metric</button><div class="qfb"></div><div class="qfb-src" hidden><p>A faithfulness threshold of 0.95 on diverse real-world cases is extremely aggressive — LLM judges rarely score that consistently, so the gate will fire on noise and block legitimate improvements. sys.exit(1) is the correct way to signal failure to a CI runner. 50 cases is a reasonable starting dataset size; thresholds are valid at that scale. Faithfulness is a well-established CI gate metric.</p></div></template><template id="wpop-7-3"><div class="qprompt"><p>You open a failing trace and see: the input question was correct, the retrieved chunk contained the right policy clause, but the model's output contradicts the chunk. Which layer is the root cause — retrieval, generation, or scoring — and what is the one-sentence reasoning?</p></div><textarea class="w-free" rows="3" placeholder="Type your answer from memory…"></textarea>
         <button class="qopt w-reveal" data-reveal="1">Reveal the reference answer</button>
         <div class="w-ref" hidden><b>Reference answer:</b> The root cause is the generation layer, because retrieval succeeded (the correct chunk was fetched) but the model produced an output that contradicts the evidence it was given, which is a hallucination at the generation step.</div><div class="qfb"></div><div class="qfb-src" hidden><p>When the retrieved chunk is correct but the output contradicts it, retrieval did its job — the failure happened when the model generated text that ignored or contradicted the source. That is a generation-layer failure (hallucination). A retrieval failure would show the wrong or missing chunk. A scoring failure would show a correct output being marked wrong.</p></div></template><template id="wpop-7-4"><div class="qprompt"><p>Six months after launch your eval suite still passes at 94%, but user-reported errors have climbed steadily. You have not added any new test cases since launch. What is the most likely diagnosis?</p></div><button class="qopt" data-ok="0"><b class="qL">A.</b> Data leakage — the model has seen the test cases during training</button><button class="qopt" data-ok="1"><b class="qL">B.</b> Test-set rot — the existing cases no longer reflect how real users are actually using the product</button><button class="qopt" data-ok="0"><b class="qL">C.</b> A flaky LLM judge inflating scores</button><button class="qopt" data-ok="0"><b class="qL">D.</b> The CI threshold is set too low</button><div class="qfb"></div><div class="qfb-src" hidden><p>Test-set rot is the classic cause: the dataset was written at launch and real user behavior has drifted, so the suite keeps passing on old patterns while missing new failure modes. Data leakage would cause artificially high scores from the start, not a gradual divergence. A flaky LLM judge would cause erratic score swings, not a steady high pass rate alongside rising real errors. A low threshold would let failures through immediately, not after months of divergence.</p></div></template><template id="wpop-8-0"><div class="eyebrow">Provenance</div><h2>Sources</h2><div class="cites"><ol><li class=""><a href="https://platform.openai.com/docs/guides/evals" target="_blank" rel="noopener noreferrer">LLM Evaluation</a> <span class="muted">· knowledge base · 2026-06-21</span></li><li class=""><a href="https://www.braintrust.dev/docs/evaluate/write-scorers" target="_blank" rel="noopener noreferrer">LLM-as-Judge</a> <span class="muted">· knowledge base · 2026-06-21</span></li><li class=""><a href="https://www.promptfoo.dev/docs/intro/" target="_blank" rel="noopener noreferrer">Regression Testing for Agentic Systems</a> <span class="muted">· knowledge base · 2026-06-21</span></li><li class=""><a href="https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/" target="_blank" rel="noopener noreferrer">ML Failure Modes and Production Testing</a> <span class="muted">· knowledge base · 2026-06-22</span></li><li class=""><a href="https://opentelemetry.io/docs/specs/semconv/gen-ai/" target="_blank" rel="noopener noreferrer">LLMOps Operating Loop</a> <span class="muted">· knowledge base · 2026-06-22</span></li></ol></div></template>

<script type="application/json" id="glossary-data">{"eval":{"id":"eval","label":"Eval (Evaluation)","laymanDefinition":"A structured experiment that runs your LLM app against a set of test inputs and checks whether the outputs meet a defined quality bar — think of it as a report card for your AI.","acronymExpansion":"Evaluation"},"assertion":{"id":"assertion","label":"Assertion","laymanDefinition":"A single checkable claim about one output — for example, 'this response must contain the word refund' — that automatically passes or fails."},"rubric-judge":{"id":"rubric-judge","label":"Rubric Judge","laymanDefinition":"A scoring method where an LLM is given a written rubric (a set of grading criteria) and asked to score another LLM's output against it, like a teacher using a marking guide."},"regression":{"id":"regression","label":"Regression","laymanDefinition":"A quality problem that was working before but broke after a change — in LLM evals, catching regressions means making sure a new model or prompt didn't quietly make things worse."},"test-case":{"id":"test-case","label":"Test Case","laymanDefinition":"One row in your eval suite: a specific input, the context the model should use, the expected output, and the scorer that will grade the result."},"exact-match":{"id":"exact-match","label":"Exact Match","laymanDefinition":"A scorer that passes only when the model's output matches the expected answer character-for-character — reliable and fast, but only useful when there is exactly one correct phrasing."},"semantic-similarity":{"id":"semantic-similarity","label":"Semantic Similarity","laymanDefinition":"A scorer that checks whether the model's answer means the same thing as the expected answer, even if the words are different — like a teacher who gives credit for a correct paraphrase."},"faithfulness":{"id":"faithfulness","label":"Faithfulness","laymanDefinition":"A metric that checks whether every claim in the model's answer is actually supported by the retrieved source documents — it catches the model making things up beyond what it was given."},"answer-relevance":{"id":"answer-relevance","label":"Answer Relevance","laymanDefinition":"A metric that checks whether the model's response actually addresses the user's question, regardless of whether the facts are correct — it catches responses that are accurate but off-topic."},"eval-framework":{"id":"eval-framework","label":"Eval Framework","laymanDefinition":"A ready-made tool (like promptfoo or DeepEval) that handles the plumbing of running test cases, calling scorers, and reporting results so you don't have to build that infrastructure yourself."},"provider-adapter":{"id":"provider-adapter","label":"Provider Adapter","laymanDefinition":"A thin connector inside an eval framework that translates a standard test-case call into the exact API format a specific model provider (like OpenAI or Anthropic) expects."},"scorer":{"id":"scorer","label":"Scorer","laymanDefinition":"The function or model that grades one test-case output and returns a pass/fail or a numeric score — it is the judge that decides whether the answer was good enough."},"dataset":{"id":"dataset","label":"Dataset","laymanDefinition":"The full collection of test cases your eval suite runs against — think of it as the exam paper that every version of your app must sit."},"trace":{"id":"trace","label":"Trace","laymanDefinition":"A step-by-step record of everything that happened for one test case — the input, the retrieved chunks, the model's output, and the scorer's reasoning — so you can see exactly where something went wrong."},"score-distribution":{"id":"score-distribution","label":"Score Distribution","laymanDefinition":"A summary showing how scores are spread across all test cases — for example, how many scored above 0.8 versus below 0.5 — so you can spot whether failures are isolated or widespread."},"diff-view":{"id":"diff-view","label":"Diff View","laymanDefinition":"A side-by-side comparison of outputs from two different model versions or prompts on the same test cases, so you can instantly see what changed and whether it got better or worse."},"ci-gate":{"id":"ci-gate","label":"CI Gate","laymanDefinition":"An automated checkpoint in your code-deployment pipeline that runs the eval suite and blocks a merge or deployment if scores fall below the required threshold — like a quality bouncer at the door.","acronymExpansion":"Continuous Integration Gate"},"threshold":{"id":"threshold","label":"Threshold","laymanDefinition":"The minimum acceptable score a metric must reach for a test run to pass — if faithfulness drops below your threshold of 0.8, the CI gate blocks the change."},"eval-pipeline":{"id":"eval-pipeline","label":"Eval Pipeline","laymanDefinition":"The end-to-end automated sequence that loads the dataset, calls the model, runs scorers, compares results to thresholds, and reports pass or fail — the whole eval process wired together."},"hallucination":{"id":"hallucination","label":"Hallucination","laymanDefinition":"When an LLM confidently states something that is factually wrong or not supported by any source it was given — the model is making things up rather than grounding its answer in evidence."},"llm-judge":{"id":"llm-judge","label":"LLM Judge","laymanDefinition":"An LLM that is used to automatically grade another LLM's output — convenient for nuanced quality checks, but can be inconsistent if its own prompt or temperature is not carefully controlled.","acronymExpansion":"Large Language Model Judge"},"data-leakage":{"id":"data-leakage","label":"Data Leakage","laymanDefinition":"When examples from your test set accidentally end up in the model's training data or prompt context, making scores look artificially high because the model has already seen the answers."},"test-set-rot":{"id":"test-set-rot","label":"Test-Set Rot","laymanDefinition":"The gradual decay of a test suite's usefulness when its cases no longer reflect real user behavior — like an exam whose questions everyone has memorized, so it stops measuring real understanding."}}</script>

function camFit(){var v=vpSize(),b=bbox();var n=document.querySelectorAll("#w-world .w-card").length;
  var s=Math.min((v.w-90)/(b.x1-b.x0),(v.h-235)/(b.y1-b.y0),n<=2?1.45:1.05);

(function(){var vp=$("w-vp"),drag=null;

/* Serpentine grid: rows of 3, odd rows flow right-to-left so the reading path
   winds continuously (card N+1 is always spatially adjacent to card N). Any card
   count gets a real row offset — the old two-row layout stacked cards 4+ of the
   top row EXACTLY on top of cards 1-3 (its Y offset was multiplied by zero). */
function gridPos(n){var X=[85,535,985],Y0=100,RH=342;
  if(n===1)return[[420,220]];
  if(n===2)return[[190,130],[880,370]];
  if(n===3)return[[85,110],[535,340],[985,110]];
  var out=[],i;
  for(i=0;i<n;i++){
    var r=Math.floor(i/3),c=i%3;
    if(r%2===1)c=2-c;
    out.push([X[c],Y0+r*RH]);
  }
  return out;}
function buildWorld(si){var S=DATA[si],w=$("w-world");
  var pos=gridPos(S.cards.length);
  var centers=pos.map(function(p){return[p[0]+180,p[1]+104];});
  var edges=centers.slice(1).map(function(b,i){var a=centers[i];
    return '<path class="w-edge" d="M '+a[0]+" "+a[1]+" C "+((a[0]+b[0])/2)+" "+a[1]+", "+((a[0]+b[0])/2)+" "+b[1]+", "+b[0]+" "+b[1]+'"/>';}).join("");
  w.innerHTML='<svg class="w-wire">'+edges+"</svg>"+S.cards.map(function(c,ci){

    return '<div class="w-card'+(S.cards.length===1?" wide":"")+(ci===0&&!S.special?" pulse":"")+'" data-ci="'+ci+'" style="left:'+pos[ci][0]+'px;top:'+pos[ci][1]+'px">'+
      '<span class="w-chip '+c.chip+'">'+c.ico+" "+escH(c.clabel)+'</span><span class="w-seen">✓ read</span>'+
      (S.cards.length>1?'<span class="w-idx" title="suggested reading order">'+(S.special?(ci+1):(ci===0?"▸ start":ci))+'</span>':"")+
      "<h3>"+escH(c.heading)+"</h3>"+
      '<div class="w-orient">'+escH(c.orient)+"</div>"+atts+
      '<div class="w-open">Open ↗</div></div>';}).join("");
  w.querySelectorAll(".w-card").forEach(function(c){c.onclick=function(){if(E.suppress)return;openPopup(si,+c.dataset.ci);};
    c.querySelectorAll(".w-att").forEach(function(btn){btn.onclick=function(e){e.stopPropagation();if(E.suppress)return;
      openPopup(si,+c.dataset.ci,+btn.dataset.ai);};});});}

    q.closest(".quiz").classList.add("revealed");markCheckDone();return;}
  var rv=ev.target.closest(".w-pob .quiz .reveal");
  if(rv){rv.closest(".quiz").classList.add("revealed");rv.disabled=true;rv.textContent="Revealed ✓";markCheckDone();return;}
  var t=ev.target.closest(".term,.term-chip");
  if(t){ev.preventDefault();ev.stopPropagation();togglePopover(t);return;}
  if(!ev.target.closest("#popover"))hidePopover();
});
function markCheckDone(){if(!E._open)return;var si=E._open[0];
  if(!DATA[si].cards[E._open[1]].check)return;
  E.doneStages[si]=E.doneStages[si]||{};E.doneStages[si][E._open[1]]=1;
  var all=DATA[si].cards.every(function(c,ci){return !c.check||E.doneStages[si][ci];});
  if(all)stampDone(si);}
function stampDone(si){var r=document.querySelectorAll("#wrail .w-nav")[si];if(r)r.classList.add("done");}
/* ---- glossary popover (ported) ---- */
var pop=document.getElementById("popover");
function togglePopover(btn){if(pop._for===btn&&pop.classList.contains("on")){hidePopover();return;}
  var tm=glossary[btn.getAttribute("data-term")];if(!tm)return;
  pop.innerHTML='<button class="pclose" type="button" aria-label="Close">×</button><div class="pt">'+escH(tm.label)+"</div>"+
    (tm.acronymExpansion?'<div class="px">'+escH(tm.acronymExpansion)+"</div>":"")+
    '<div class="pn">'+escH(tm.laymanDefinition)+"</div>"+(tm.technicalNote?'<div class="ptech">'+escH(tm.technicalNote)+"</div>":"");
  pop.classList.add("on");pop._for=btn;
  var r=btn.getBoundingClientRect(),top=r.bottom+8,left=Math.min(r.left,window.innerWidth-330);
  if(top+pop.offsetHeight>window.innerHeight)top=r.top-pop.offsetHeight-8;
  pop.style.top=Math.max(8,top)+"px";pop.style.left=Math.max(8,left)+"px";
  pop.querySelector(".pclose").onclick=hidePopover;}
function hidePopover(){pop.classList.remove("on");pop._for=null;}
/* ---- interactive viz hydration inside popups (scatter / slider / stepped; same data contract) ---- */
function vEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function buildSlider(body,data){var min=+data.min,max=+data.max,unit=data.unit||"",stops=(data.stops||[]).slice().sort(function(a,b){return a.at-b.at;});
  if(stops.length<2||!(max>min))return;
  var step=(max-min)/100;if(!(step>0))step=1;
  body.innerHTML='<div class="viz-slider-row"><span class="viz-readout">'+vEsc(min)+'</span><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+stops[0].at+'"><span class="viz-readout">'+vEsc(max)+"</span></div>"+
    '<div class="viz-readout" style="margin-top:8px">Value: <b class="vs-val"></b> '+vEsc(unit)+"</div>"+
    '<div class="viz-stop-note"><span class="vsn-label vs-lab"></span><span class="vs-note"></span></div>';
  var range=body.querySelector("input"),val=body.querySelector(".vs-val"),lab=body.querySelector(".vs-lab"),note=body.querySelector(".vs-note");
  function nearest(v){var best=stops[0],bd=Math.abs(v-stops[0].at);for(var i=1;i<stops.length;i++){var d=Math.abs(v-stops[i].at);if(d<bd){bd=d;best=stops[i];}}return best;}
  function upd(){var v=+range.value;val.textContent=Math.round(v*100)/100;var s=nearest(v);lab.textContent=s.label+" — ";note.textContent=s.note;}
  range.addEventListener("input",upd);upd();}
function buildStepped(body,data){var steps=data.steps||[];if(steps.length<2)return;
  body.innerHTML='<div class="viz-steps-nav">'+steps.map(function(s,i){return '<button class="viz-step-btn'+(i===0?" active":"")+'" data-si="'+i+'"><span class="vsb-n">'+(i+1)+"</span>"+(s.icon?vEsc(s.icon)+" ":"")+vEsc(s.label)+"</button>";}).join("")+'</div><div class="viz-step-detail"></div>';
  var detail=body.querySelector(".viz-step-detail");
  function show(i){var s=steps[i];detail.innerHTML="<h4>"+(s.icon?vEsc(s.icon)+" ":"")+vEsc(s.label)+"</h4>"+vEsc(s.detail);
    body.querySelectorAll(".viz-step-btn").forEach(function(b,bi){b.classList.toggle("active",bi===i);});}
  body.querySelector(".viz-steps-nav").addEventListener("click",function(e){var b=e.target.closest(".viz-step-btn");if(b)show(+b.getAttribute("data-si"));});
  show(0);}
function buildScatter(body,data){var pts=data.points||[],qs=data.queries||[];if(pts.length<1||qs.length<1)return;
  var W=460,H=300,PAD=34;
  function sx(x){return PAD+(Math.max(0,Math.min(100,x))/100)*(W-2*PAD);}
  function sy(y){return PAD+(Math.max(0,Math.min(100,y))/100)*(H-2*PAD);}
  body.innerHTML='<div class="viz-controls">'+qs.map(function(q,i){return '<button class="viz-qbtn'+(i===0?" sel":"")+'" data-qi="'+i+'">'+vEsc(q.label)+"</button>";}).join("")+"</div>"+
    '<div class="viz-scatter-grid"><svg class="scatter" viewBox="0 0 '+W+" "+H+'"></svg><div><div class="viz-near-lab">Nearest matches</div><ol class="viz-near"></ol></div></div>';
  var svg=body.querySelector("svg.scatter"),near=body.querySelector(".viz-near"),maxD=Math.hypot(100,100);
  function draw(qi){var q=qs[qi];
    var ranked=pts.map(function(p){return{p:p,d:Math.hypot((p.x||0)-q.x,(p.y||0)-q.y)};}).sort(function(a,b){return a.d-b.d;});
    var nearSet={};ranked.slice(0,3).forEach(function(r){nearSet[r.p.label]=1;});
    var h="";
    ranked.slice(0,3).forEach(function(r){h+='<line x1="'+sx(q.x)+'" y1="'+sy(q.y)+'" x2="'+sx(r.p.x)+'" y2="'+sy(r.p.y)+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>';});
    pts.forEach(function(p){var on=nearSet[p.label];h+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="'+(on?7:5)+'" fill="'+(on?"var(--accent)":"var(--border-strong)")+'" stroke="var(--surface)" stroke-width="2"/>'+
      '<text x="'+(sx(p.x)+9)+'" y="'+(sy(p.y)-8)+'" font-size="10.5" fill="'+(on?"var(--accent-2)":"var(--muted)")+'">'+vEsc(String(p.label).slice(0,22))+"</text>";});
    h+='<text x="'+sx(q.x)+'" y="'+(sy(q.y)+6)+'" font-size="20" text-anchor="middle" fill="var(--accent)">★</text>';
    svg.innerHTML=h;
    near.innerHTML=ranked.slice(0,3).map(function(r){return "<li>"+vEsc(r.p.label)+"</li>";}).join("");}
  body.querySelector(".viz-controls").addEventListener("click",function(e){var b=e.target.closest(".viz-qbtn");if(!b)return;
    body.querySelectorAll(".viz-qbtn").forEach(function(x){x.classList.remove("sel");});b.classList.add("sel");draw(+b.getAttribute("data-qi"));});
  draw(0);}
function hydrate(root){root.querySelectorAll(".viz").forEach(function(viz){
  if(viz._hyd)return;viz._hyd=true;
  var kind=viz.getAttribute("data-viz"),dataEl=viz.querySelector(".viz-data"),body=viz.querySelector(".viz-body");
  if(!dataEl||!body)return;var data;try{data=JSON.parse(dataEl.textContent||"{}");}catch(e){return;}
  try{if(kind==="scatter")buildScatter(body,data);else if(kind==="slider")buildSlider(body,data);else if(kind==="stepped")buildStepped(body,data);}catch(e){}});}
/* ---- beats ---- */
function beatsFor(si){var S=DATA[si],beats=[];
  beats.push(function(){closePopup();camFit();focus([]);hotEdge(-1);
    cap([[escH(S.rail).toUpperCase()+" · MENTAL MAP OF "+S.cards.length+" BLOCK"+(S.cards.length>1?"S":""),"kck"],
         ['<span class="hl">'+escH(S.rail)+"</span> — "+escH(S.tagline),"one"],
         ["Click a card for the full detail · drag the canvas · scroll to zoom","hint"]]);});
  S.cards.forEach(function(c,ci){beats.push(function(){closePopup();
    var el=document.querySelector('#w-world .w-card[data-ci="'+ci+'"]');
    if(el)camFocusEl(el);focus([ci]);hotEdge(ci-1);
    cap([[c.ico+" "+escH(c.clabel)+" · "+escH(c.heading).toUpperCase(),"kck"],[escH(c.capline||c.orient),"one"]]);
    if(c.check)openPopup(si,ci);});});
  beats.push(function(){closePopup();camFit();focus([]);hotEdge(-1);
    var nx=si<DATA.length-1?DATA[si+1]:null;
    cap([['<span style="color:var(--wgood)">'+escH(S.rail)+" ✓</span>","one"]].concat(nx?[["Up next — "+escH(nx.rail),"hint"]]:[["Lesson complete 🎉","hint"]]),
      nx?'<button class="w-nextmod" onclick="__wgoto('+(si+1)+')">Continue → '+escH(nx.rail)+"</button>"
        :'<button class="w-nextmod" onclick="__wgoto(0)">↺ Replay lesson</button>');});
  return beats;}
function gotoStage(n){if(n<0||n>=DATA.length)return;
  E.gen++;
  var vp=$("w-vp");vp.classList.add("swap");
  setTimeout(function(){E.si=n;E.bi=0;
    buildWorld(n);closePopupSilent();
    BEATS=beatsFor(n);$("w-st").textContent=BEATS.length;$("w-kick").textContent=DATA[n].kick;
    document.querySelectorAll("#wrail .w-nav").forEach(function(r,k){r.classList.toggle("active",k===n);});
    markVisited(n);
    vp.classList.remove("swap");
    nextBeat();
  },420);}
window.__wgoto=gotoStage;
function closePopupSilent(){$("w-po").classList.remove("on");$("w-poback").classList.remove("on");E._open=null;}
function nextBeat(){if(E.bi>=BEATS.length){if(E.si<DATA.length-1)gotoStage(E.si+1);return;}
  BEATS[E.bi]();E.bi++;paint();}
function paint(){$("w-sn").textContent=E.bi;
  $("w-next").textContent=E.bi>=BEATS.length?(E.si<DATA.length-1?"Next module ▸":"Done ✓"):"Next ▸";
  $("w-next").disabled=E.bi>=BEATS.length&&E.si>=DATA.length-1;}
$("w-next").onclick=function(){nextBeat();};
$("w-reset").onclick=function(){gotoStage(E.si);};
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closePopup();hidePopover();return;}
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  if(e.key==="ArrowRight"){e.preventDefault();nextBeat();}
  if(e.key==="ArrowLeft"){e.preventDefault();if(E.bi>1){E.bi=E.bi-2;BEATS[E.bi]();E.bi++;paint();}}});
$("w-railbtn").onclick=function(){var on=$("wroot").classList.toggle("rail-open");$("w-railbtn").classList.toggle("on",on);};
/* ---- progress relay to the host app (same contract as the classic runtime) ---- */
var moduleStages=DATA.filter(function(s){return !s.special;}).length||1;
function markVisited(si){if(DATA[si]&&!DATA[si].special)E.visited[si]=1;
  var n=Object.keys(E.visited).length,pct=Math.round(n/moduleStages*100);
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:"als-progress",visited:n,total:moduleStages,percent:pct,module:DATA[si]&&DATA[si].moduleId||null},"*");}catch(e){}}
/* ---- stub modules: trigger their build + self-refresh until they arrive ---- */
(function(){var stubs=DATA.filter(function(s){return s.stub;});
  if(!stubs.length||!ARTIFACT_ID)return;
  stubs.forEach(function(s){try{fetch("/api/module",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({artifactId:ARTIFACT_ID,moduleId:s.moduleId})}).catch(function(){});}catch(e){}});
  setTimeout(function(){location.reload();},22000);})();
/* ---- theme toggle (dark default; choice persists across lessons) ---- */
(function(){var KEY="als-world-theme",btn=$("w-theme");
  function apply(t){document.documentElement.setAttribute("data-theme",t);document.body.setAttribute("data-theme",t);
    btn.textContent=t==="light"?"☾ Dark":"☀ Light";}
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  apply(saved==="light"?"light":"dark");
  btn.onclick=function(){var t=document.body.getAttribute("data-theme")==="light"?"dark":"light";
    apply(t);try{localStorage.setItem(KEY,t);}catch(e){}};})();
/* ---- rail + boot ---- */
(function(){var rail=$("wrail");
  DATA.forEach(function(s,i){var b=document.createElement("button");b.className="w-nav";
    b.innerHTML='<span class="n">'+escH(s.num)+"</span>"+escH(s.rail);
    b.onclick=function(){gotoStage(i);};rail.appendChild(b);});
  gotoStage(Math.min(WCFG.startStage||0,DATA.length-1));})();
})();
</script>
