  --line:#94a3b8;}.viz-svg .title{font-size:34px;font-weight:800;fill:var(--ink);letter-spacing:-.4px}.viz-svg .kicker{font-size:13px;font-weight:700;fill:var(--kicker);letter-spacing:1.4px;text-transform:uppercase}.viz-svg .label{font-size:19px;font-weight:700;fill:var(--label)}.viz-svg .label-on{font-size:19px;font-weight:700;fill:#ffffff}.viz-svg .sub{font-size:13px;font-weight:600;fill:var(--annotation)}.viz-svg .sub-on{font-size:13px;font-weight:600;fill:#ffffff;fill-opacity:.86}.viz-svg .annotation{font-size:13px;font-weight:600;fill:var(--annotation)}.viz-svg .caption{font-size:15px;font-weight:600;fill:var(--caption)}.viz-svg .tag{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.viz-svg .example-text{font-size:15px;font-weight:600;fill:#344054}.viz-svg .conn{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.viz-svg .conn-dashed{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:2 7}.viz-svg .node{rx:14}</style><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#0b1220" flood-opacity="0.08"/></filter></defs><rect x="14" y="14" width="972" height="972" rx="22" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><text x="60" y="74" text-anchor="start" class="title" font-size="34" font-weight="800" fill="#101828">Retrieval Evaluation</text><text x="60" y="104" text-anchor="start" class="kicker" font-size="13" font-weight="700" fill="#667085" letter-spacing="1.4" style="text-transform:uppercase">RAG TOOLING</text><line x1="60" y1="124" x2="940" y2="124" stroke="#e6eaf0" stroke-width="1.5"/><rect x="60" y="166" width="422" height="648" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><rect x="60" y="166" width="422" height="56" rx="16" fill="#0d9488"/><rect x="60" y="206" width="422" height="16" fill="#0d9488"/><text x="271" y="198.2" text-anchor="middle" class="label" font-size="20" font-weight="800" fill="#ffffff"><tspan x="271" dy="0">Non-LLM metrics</tspan></text><circle cx="84" cy="363" r="5" fill="#0d9488"/><text x="100" y="356.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">Context recall</tspan></text><text x="100" y="404" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">did we find it?</text><circle cx="84" cy="461" r="5" fill="#0d9488"/><text x="100" y="454.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">Precision @ k</tspan></text><text x="100" y="502" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">hits in top-k</text><circle cx="84" cy="559" r="5" fill="#0d9488"/><text x="100" y="552.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">MRR / nDCG</tspan></text><text x="100" y="600" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">rank-aware order</text><circle cx="84" cy="657" r="5" fill="#0d9488"/><text x="100" y="650.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#0f766e"><tspan x="100" dy="0">BLEU / ROUGE</tspan></text><text x="100" y="698" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">lexical overlap</text><rect x="518" y="166" width="422" height="648" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="518" y="166" width="422" height="56" rx="16" fill="#4f46e5"/><rect x="518" y="206" width="422" height="16" fill="#4f46e5"/><text x="729" y="198.2" text-anchor="middle" class="label" font-size="20" font-weight="800" fill="#ffffff"><tspan x="729" dy="0">LLM-as-judge</tspan></text><circle cx="542" cy="363" r="5" fill="#4f46e5"/><text x="558" y="356.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Faithfulness</tspan></text><text x="558" y="404" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">answer grounded in ctx</text><circle cx="542" cy="461" r="5" fill="#4f46e5"/><text x="558" y="454.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Answer relevance</tspan></text><text x="558" y="502" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">on-topic vs query</text><circle cx="542" cy="559" r="5" fill="#4f46e5"/><text x="558" y="552.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">Context relevance</tspan></text><text x="558" y="600" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">chunks actually useful</text><circle cx="542" cy="657" r="5" fill="#4f46e5"/><text x="558" y="650.4" text-anchor="start" class="label" font-size="16" font-weight="700" fill="#3730a3"><tspan x="558" dy="0">RAGAS / agent goal</tspan></text><text x="558" y="698" text-anchor="start" class="annotation" font-size="12.5" font-weight="600" fill="#475467">automated eval suite</text><circle cx="500" cy="490" r="22" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><text x="500" y="495" text-anchor="middle" class="annotation" font-size="14" font-weight="800" fill="#667085">VS</text><text x="500" y="842" text-anchor="middle" class="caption" font-size="15" font-weight="600" fill="#475467">score retrieval, not just answers</text><rect x="60" y="854" width="880" height="70" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="60" y="854" width="6" height="70" rx="3" fill="#4f46e5"/><text x="82" y="880" text-anchor="start" class="tag" font-size="11" font-weight="800" fill="#3730a3" letter-spacing="0.8" style="text-transform:uppercase">EXAMPLE</text><text x="82" y="906" text-anchor="start" class="example-text" font-size="15" font-weight="600" fill="#344054"><tspan x="82" dy="0">RAGAS flags a confident answer as unfaithful because none of the retrieved chunks support it.</tspan></text></svg></div></template><template id="wpop-1-1"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Recap: What an Eval Actually Measures</h3><div class="callout info">Before reading on, predict from memory: <strong>Module 1 introduced the word </strong><button class="term" data-term="assertion">assertion<span class="i">i</span></button>. What is an assertion, and how does it differ from a rubric judge? Write your answer in one sentence before scrolling.</div><p>An <button class="term" data-term="assertion">assertion<span class="i">i</span></button> is a single pass/fail check on one output property. Example: "does the reply contain 'refund'?" A <button class="term" data-term="rubric-judge">rubric judge<span class="i">i</span></button> asks another LLM to score softer qualities like tone on a 1–5 scale. Both live inside a <button class="term" data-term="test-case">test case<span class="i">i</span></button>.</p><p><em>Module 1 showed </em><em>what</em> evals measure.<em> This module answers: </em>how do you write test cases? By the end, you will have a 50-case dataset for a customer-support chatbot and know which metric fits each case.</p><div class="keyterms"><button class="term-chip" data-term="eval">Eval (Evaluation)<span class="i">i</span></button><button class="term-chip" data-term="assertion">Assertion<span class="i">i</span></button><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button></div></div></template><template id="wpop-1-2"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>The Four-Field Anatomy of a Test Case</h3><div class="analogy"><span class="an-lab">In plain words</span>A test case is like a recipe card: the ingredient list (input + context) tells the kitchen what to work with, the dish name (expected intent label) says what should come out, and the tasting notes (pass criteria) say how to judge whether it succeeded.</div><p>Every test case needs exactly four fields. Missing even one makes it unrunnable. Think of them as a contract: you supply inputs and the bar, the system supplies the verdict.</p><ul><li><strong>input</strong> — the raw user message, word for word (e.g., "Where is my order #4821?").</li><li><strong>retrieval context</strong> — support-knowledge chunks the RAG layer would hand to the model; you pin this for reproducibility.</li><li><strong>expected intent label</strong> — the category the model should classify into (e.g., "shipping_status", "refund_request").</li><li><strong>pass criteria</strong> — the measurable bar the output must clear (e.g., "intent == 'refund_request' AND cites 30-day policy").</li></ul><p>Most beginners under-specify the pass criteria field. "The answer should be helpful" is a wish, not a criterion. A real criterion names the exact string, label, or threshold so a machine can decide pass or fail without guessing.</p><div class="keyterms"><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button></div></div></template><template id="wpop-1-3"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Four Metrics, Four Different Questions</h3><div class="analogy"><span class="an-lab">In plain words</span>Choosing a metric is like choosing a measuring tool: a ruler checks length, a thermometer checks temperature — using the wrong one gives you a number that sounds precise but answers the wrong question.</div><p>A <button class="term" data-term="scorer">scorer<span class="i">i</span></button> is the function that turns a model's output into a number or a pass/fail verdict. You pick one scorer per pass criterion, and the choice must match what your product actually cares about. There are four scorers you will use in this module, each answering a different question.</p><ul><li><button class="term" data-term="exact-match"><strong>Exact match</strong><span class="i">i</span></button> — "Is the output character-for-character identical to the expected string?" Use this for intent labels, status codes, or any output that must be a fixed value.</li><li><button class="term" data-term="semantic-similarity"><strong>Semantic similarity</strong><span class="i">i</span></button> — "Does the output mean the same thing as the reference, even if the words differ?" Use this for free-text replies where paraphrasing is fine. The embedding model (text-embedding-3-small at 1536 dimensions) converts both strings to vectors and measures the cosine distance between them.</li><li><button class="term" data-term="faithfulness"><strong>Faithfulness</strong><span class="i">i</span></button> — "Does every claim in the reply appear in the retrieved context?" Use this to catch <button class="term" data-term="hallucination">hallucinations<span class="i">i</span></button> — facts the model invented rather than retrieved.</li><li><button class="term" data-term="answer-relevance"><strong>Answer relevance</strong><span class="i">i</span></button> — "Does the reply actually address what the user asked?" Use this when the model might give a technically accurate but off-topic response.</li></ul><p>A single test case can carry more than one scorer — for example, an escalation case might check exact-match on the intent label AND faithfulness on the explanation the bot gives. But every scorer you add is another thing that can fail, so add only the scorers that map to a real product requirement.</p><div class="keyterms"><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="semantic-similarity">Semantic Similarity<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button></div></div></template><template id="wpop-1-3-a0"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 1: Write One Complete Test Case</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># One test case — refund intent, happy path</span>
test_case = {
    <span class="tk-s">"input"</span>: <span class="tk-s">"I want to return my jacket. How do I get a refund?"</span>,
    <span class="tk-s">"retrieval_context"</span>: (
        <span class="tk-s">"Policy: customers may return items within 30 days "</span>
        <span class="tk-s">"of delivery for a full refund."</span>
    ),
    <span class="tk-s">"expected_intent"</span>: <span class="tk-s">"refund_request"</span>,
    <span class="tk-s">"pass_criteria"</span>: {
        <span class="tk-s">"intent_exact_match"</span>: <span class="tk-s">"refund_request"</span>,   <span class="tk-c"># exact-match scorer</span>
        <span class="tk-s">"faithfulness_threshold"</span>: <span class="tk-n">0.85</span>,            <span class="tk-c"># faithfulness scorer</span>
    },
}</pre></div><p>This is the smallest valid test case for the refund intent — all four fields are present and each pass criterion names a specific scorer and threshold. The retrieval context is pinned to a single policy sentence so the test gives the same result every time you run it, regardless of what the live knowledge base contains.</p><div class="quiz"><div class="q">Predict: Before revealing: if the chatbot replies 'You can return your jacket within 30 days for a full refund' — does this case PASS or FAIL the faithfulness check, and why?</div><button class="reveal">Reveal</button><div class="answer"><p>PASS. Every claim in the reply ('30 days', 'full refund') appears verbatim in the pinned retrieval context, so the faithfulness scorer finds no invented facts. The intent label 'refund_request' also matches exactly, so both criteria pass.</p></div></div></div></div><div class="keyterms"><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button></div></div></template><template id="wpop-1-3-a1"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 2: Scale to 50 Cases Across Three Intents</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># Build a 50-case dataset: refund (20), shipping (20), escalation (10)</span>
<span class="tk-k">import</span> copy

BASE_CASES = [
    <span class="tk-c"># --- refund (happy path + edge cases) ---</span>
    {<span class="tk-s">"input"</span>: <span class="tk-s">"I want to return my jacket."</span>,
     <span class="tk-s">"retrieval_context"</span>: <span class="tk-s">"Policy: 30-day returns for full refund."</span>,
     <span class="tk-s">"expected_intent"</span>: <span class="tk-s">"refund_request"</span>,
     <span class="tk-s">"pass_criteria"</span>: {<span class="tk-s">"intent_exact_match"</span>: <span class="tk-s">"refund_request"</span>,
                       <span class="tk-s">"faithfulness_threshold"</span>: <span class="tk-n">0.85</span>}},
    {<span class="tk-s">"input"</span>: <span class="tk-s">"It's been 35 days — can I still get my money back?"</span>,
     <span class="tk-s">"retrieval_context"</span>: <span class="tk-s">"Policy: 30-day returns for full refund."</span>,
     <span class="tk-s">"expected_intent"</span>: <span class="tk-s">"refund_request"</span>,
     <span class="tk-s">"pass_criteria"</span>: {<span class="tk-s">"intent_exact_match"</span>: <span class="tk-s">"refund_request"</span>,
                       <span class="tk-s">"answer_relevance_threshold"</span>: <span class="tk-n">0.80</span>}},
    <span class="tk-c"># … 18 more refund cases (happy paths, wrong-item, damaged-goods)</span>

    <span class="tk-c"># --- shipping (happy path + edge cases) ---</span>
    {<span class="tk-s">"input"</span>: <span class="tk-s">"Where is my order #4821?"</span>,
     <span class="tk-s">"retrieval_context"</span>: <span class="tk-s">"Order #4821: shipped 2024-06-01, ETA 2024-06-05."</span>,
     <span class="tk-s">"expected_intent"</span>: <span class="tk-s">"shipping_status"</span>,
     <span class="tk-s">"pass_criteria"</span>: {<span class="tk-s">"intent_exact_match"</span>: <span class="tk-s">"shipping_status"</span>,
                       <span class="tk-s">"semantic_similarity_threshold"</span>: <span class="tk-n">0.80</span>}},
    <span class="tk-c"># … 19 more shipping cases</span>

    <span class="tk-c"># --- escalation ---</span>
    {<span class="tk-s">"input"</span>: <span class="tk-s">"This is unacceptable. I need to speak to a manager NOW."</span>,
     <span class="tk-s">"retrieval_context"</span>: <span class="tk-s">""</span>,   <span class="tk-c"># no doc needed — pure intent signal</span>
     <span class="tk-s">"expected_intent"</span>: <span class="tk-s">"escalate_to_agent"</span>,
     <span class="tk-s">"pass_criteria"</span>: {<span class="tk-s">"intent_exact_match"</span>: <span class="tk-s">"escalate_to_agent"</span>}},
    <span class="tk-c"># … 9 more escalation cases</span>
]

<span class="tk-k">print</span>(f<span class="tk-s">"Dataset size: {len(BASE_CASES)} cases loaded"</span>)  <span class="tk-c"># → 5 shown; target 50</span></pre></div><p>This stage shows the delta from Stage 1: you now have three intent buckets, each with its own metric choice, and the retrieval context is pinned per case. Notice that the escalation case has an empty retrieval context — the intent is carried entirely by the user's tone, so faithfulness is irrelevant and exact-match on the label is the only criterion needed.</p><div class="quiz"><div class="q">Stop — attempt this before revealing. The 35-day refund case uses answer_relevance instead of faithfulness. Why is faithfulness the WRONG metric here? Write your reason, then reveal.</div><button class="reveal">Reveal</button><div class="answer"><p>The policy says 30 days, so the bot's correct answer is 'no refund after 30 days.' Faithfulness would check whether that claim is grounded in context — it is — but it would PASS even if the bot gave a completely off-topic reply about shipping. Answer relevance checks that the reply actually addresses the out-of-window refund question, which is the real risk here. Changed lines: pass_criteria uses 'answer_relevance_threshold' instead of 'faithfulness_threshold'.</p></div></div></div></div><div class="keyterms"><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="semantic-similarity">Semantic Similarity<span class="i">i</span></button><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button></div></div></template><template id="wpop-1-3-a2"><div class="block reveal needs-functional b-funcex blk-example"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">💡</span><span class="col-lab">Checking AI-Generated Test Cases Before You Trust Them</span><span class="col-chev">▸</span></button><div class="collapse-body"><p>You will likely use an LLM to draft your 50 cases — it is fast and covers phrasing variety you would miss alone. But generated cases carry specific failure patterns you must check before adding them.</p><ol><li><strong>Check that retrieval context is relevant to the input.</strong> LLMs sometimes paste generic boilerplate. If context lacks the information needed to answer, the faithfulness scorer will always fail — not because the bot hallucinated, but because the test is broken.</li><li><strong>Verify the expected intent label matches your defined categories.</strong> A generated case might use 'return_request' when your schema says 'refund_request'. Exact-match will always fail on a typo, wasting hours debugging.</li><li><strong>Confirm pass criteria name a real scorer and numeric threshold.</strong> Vague criteria like 'should be polite' are not machine-runnable. Replace them with a specific scorer key and threshold (e.g., faithfulness_threshold: 0.85).</li><li><strong>Spot-check 10% of cases by hand.</strong> Run the chatbot on those inputs manually. Does the expected intent label match what a real support agent would classify this as? If not, the whole batch may be mislabelled.</li><li><strong>Check for leakage if you seeded the generator with production logs.</strong> Compare generated inputs against your training data. Any near-duplicate is a data-leakage risk and must be removed or rewritten.</li></ol><p>With a clean, verified 50-case dataset, you are ready for Module 3. It shows how to wire these cases into an eval pipeline that runs automatically on every code change. Your dataset becomes a release gate, not just a spreadsheet.</p></div></div><div class="keyterms"><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="data-leakage">Data Leakage<span class="i">i</span></button></div></div></template><template id="wpop-1-4"><div class="block reveal"><h3>Metric Fit by Product Requirement</h3><div class="matrix"><table class="dm"><thead><tr><th>Option</th><th>Catches hallucinations</th><th>Tolerates paraphrase</th><th>When to choose</th><th>Cost</th><th>Complexity</th></tr></thead><tbody><tr><td><strong>Exact Match</strong></td><td><span class="rate bad"></span>No — only checks the label, not the content</td><td><span class="rate bad"></span>No — any word difference = fail</td><td class="when">Intent labels, status codes, or any output that must be a fixed string — e.g., the chatbot must return exactly 'escalate_to_agent'.</td><td>Near zero</td><td>Trivial — string equality</td></tr><tr><td><strong>Semantic Similarity</strong></td><td><span class="rate bad"></span>No — measures meaning match, not source grounding</td><td><span class="rate good"></span>Yes — cosine similarity rewards same meaning</td><td class="when">Free-text replies where the meaning matters but exact wording does not — e.g., a shipping-status explanation that can be phrased many ways.</td><td>Low (text-embedding-3-small)</td><td>Low — one embedding call per pair</td></tr><tr><td><strong>Faithfulness</strong></td><td><span class="rate good"></span>Yes — verifies every claim is in the retrieved context</td><td><span class="rate good"></span>Yes — checks grounding, not exact wording</td><td class="when">Any RAG reply where the model must not invent facts — e.g., quoting the 30-day refund policy; critical for compliance-sensitive support flows.</td><td>Medium (one judge call per case)</td><td>Medium — requires an LLM judge call</td></tr><tr><td><strong>Answer Relevance</strong></td><td><span class="rate bad"></span>No — only checks topical fit, not factual grounding</td><td><span class="rate good"></span>Yes — judges intent alignment, not exact wording</td><td class="when">Cases where the model might give a correct but off-topic reply — e.g., answering a shipping question with refund policy details.</td><td>Medium (one judge call per case)</td><td>Medium — requires an LLM judge call</td></tr></tbody></table></div><div class="keyterms"><button class="term-chip" data-term="exact-match">Exact Match<span class="i">i</span></button><button class="term-chip" data-term="semantic-similarity">Semantic Similarity<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button></div></div></template><template id="wpop-1-5"><div class="block reveal"><h3>How Test-Case Datasets Break in Practice</h3><div class="callout warn"><h4>Failure 1 — Pinned context goes stale (Test-Set Rot)</h4><p>You pin the retrieval context at write-time, but the live knowledge base changes. Six months later the policy shifts to 45 days, but your test still says 30 days. The test passes even though the bot is now giving customers wrong information. This is called <button class="term" data-term="test-set-rot">test-set rot<span class="i">i</span></button> — the dataset silently drifts out of sync with reality. Fix: version your context snapshots and schedule a quarterly review.</p><h4>Failure 2 — Threshold set too low (Silent Hallucination Pass)</h4><p>A faithfulness <button class="term" data-term="threshold">threshold<span class="i">i</span></button> of 0.50 means a reply that invents half its facts still passes. The symptom is invisible: your eval dashboard shows green, but customers receive fabricated policy details. Start at 0.85 for compliance-sensitive intents and lower it only with explicit justification.</p><h4>Failure 3 — Data Leakage from Production Logs</h4><p>If you copy real user messages into your test set and then fine-tune the model on the same logs, the model has already seen the test inputs. Scores look excellent, but you are measuring memorisation, not generalisation. This is <button class="term" data-term="data-leakage">data leakage<span class="i">i</span></button> — the observable symptom is a suspiciously high score on production-log cases and a much lower score on freshly written cases. Fix: keep a held-out split of logs that never touches the training pipeline.</p></div><div class="keyterms"><button class="term-chip" data-term="test-set-rot">Test-Set Rot<span class="i">i</span></button><button class="term-chip" data-term="data-leakage">Data Leakage<span class="i">i</span></button><button class="term-chip" data-term="hallucination">Hallucination<span class="i">i</span></button><button class="term-chip" data-term="threshold">Threshold<span class="i">i</span></button></div></div></template><template id="wpop-2-0"><p>Configure the 50 chatbot cases to run against GPT-4o (gpt-4o-2024-08-06) and Claude 3.5 Sonnet (claude-3-5-sonnet-20241022) simultaneously by building the same harness two ways — a promptfoo YAML config and a DeepEval pytest fixture — so you can see the provider adapter, scorer declaration, and dataset file layout for each approach side by side.</p><p>This module shows you how to build the eval harness — the machinery that feeds your 50 chatbot test cases to GPT-4o and Claude 3.5 Sonnet and collects faithfulness and answer-relevance scores — using both promptfoo (YAML) and DeepEval (pytest).</p><div class="po-analogy"><b>In plain words —</b> The harness is like a test jig in a factory: it holds every part in place so the same checks run the same way every time.</div><p><b>Why this matters:</b> Without a harness, your test cases are just a static file; this module turns them into a repeatable, automated measurement system you can run on every code change.</p><h4>After this you'll be able to</h4><ul><li>After this you'll be able to write a working promptfoo YAML config that runs your dataset against two providers with declared scorers.</li><li>After this you'll be able to write a DeepEval pytest fixture that loads the same 50 cases and asserts faithfulness and answer relevance.</li><li>After this you'll be able to decide whether promptfoo or DeepEval fits your existing stack based on three concrete criteria.</li><li>After this you'll be able to verify that an AI-generated harness config is wired correctly by checking provider, scorer, and dataset references.</li></ul><p><b>Decision this forces:</b> promptfoo (YAML-first, CLI) vs. DeepEval (pytest-native, Python SDK) — which fits your existing stack</p><h4>Eval Frameworks: Promptfoo, DeepEval, Ragas</h4><div class="po-visual"><svg class="viz-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eval Frameworks: Promptfoo, DeepEval, Ragas" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>.viz-svg{color-scheme: light;

dth="188" height="78" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="768.5" y="369.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#1d4ed8"><tspan x="768.5" dy="0">Run prompt</tspan></text><text x="768.5" y="400.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#1d4ed8" fill-opacity="0.72"><tspan x="768.5" dy="0">across models</tspan></text></g><g filter="url(#sh)"><rect x="674.5" y="571.5" width="188" height="78" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="768.5" y="604.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#3730a3"><tspan x="768.5" dy="0">Assertions</tspan></text><text x="768.5" y="635.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#3730a3" fill-opacity="0.72"><tspan x="768.5" dy="0">contains, regex, sim</tspan></text></g><g filter="url(#sh)"><rect x="406" y="689" width="188" height="78" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="500" y="722.4" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#0f766e"><tspan x="500" dy="0">Ragas / G-Eval</tspan></text><text x="500" y="752.7" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#0f766e" fill-opacity="0.72"><tspan x="500" dy="0">faithfulness, relevancy</tspan></text></g><g filter="url(#sh)"><rect x="137.5" y="571.5" width="188" height="78" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="231.5" y="604.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#6d28d9"><tspan x="231.5" dy="0">Score table</tspan></text><text x="231.5" y="635.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#6d28d9" fill-opacity="0.72"><tspan x="231.5" dy="0">pass / fail rate</tspan></text></g><g filter="url(#sh)"><rect x="137.5" y="336.5" width="188" height="78" rx="14" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/><text x="231.5" y="369.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#ffffff"><tspan x="231.5" dy="0">Gate CI</tspan></text><text x="231.5" y="400.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.86"><tspan x="231.5" dy="0">block regressions</tspan></text></g><text x="500" y="842" text-anchor="middle" class="caption" font-size="15" font-weight="600" fill="#475467">score prompts on every change</text><rect x="60" y="854" width="880" height="70" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="60" y="854" width="6" height="70" rx="3" fill="#4f46e5"/><text x="82" y="880" text-anchor="start" class="tag" font-size="11" font-weight="800" fill="#3730a3" letter-spacing="0.8" style="text-transform:uppercase">EXAMPLE</text><text x="82" y="906" text-anchor="start" class="example-text" font-size="15" font-weight="600" fill="#344054"><tspan x="82" dy="0">Promptfoo runs 50 cases across GPT-4o vs Claude; Ragas scores RAG faithfulness in CI.</tspan></text></svg></div></template><template id="wpop-2-1"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Recap: Your 50 Cases Are Ready</h3><div class="analogy"><span class="an-lab">In plain words</span>Your dataset is like a stack of exam papers already printed; the harness is the proctor who hands each paper to every student (model) and collects the marked answers.</div><div class="callout info">Before reading on, recall from memory: in Module 2, what three fields does every <button class="term" data-term="test-case">test case<span class="i">i</span></button> record? Write them down, then keep reading to check yourself.</div><p><button class="term" data-term="test-case">test cases<span class="i">i</span></button><strong> store three things: user </strong>input<strong>, reference </strong>context<strong> (the retrieved document), and expected </strong>output properties. The properties are <button class="term" data-term="assertion">assertions<span class="i">i</span></button> like <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button> and <button class="term" data-term="semantic-similarity">semantic similarity<span class="i">i</span></button>.</p><p><strong>Your 50 cases live in a </strong><button class="term" data-term="dataset">dataset<span class="i">i</span></button><strong> file. Right now nothing runs them against any model. This module wires the dataset to two real models: GPT-4o and Claude 3.5 Sonnet. It declares which </strong><button class="term" data-term="scorer">scorers<span class="i">i</span></button> grade each response. You get actual pass/fail numbers instead of a static list.</p><p><strong>The driving question: </strong>how do you build the harness — the machinery that feeds every case to every model and collects scores — without duplicating plumbing?</p><div class="keyterms"><button class="term-chip" data-term="test-case">Test Case<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="assertion">Assertion<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="semantic-similarity">Semantic Similarity<span class="i">i</span></button></div></div></template><template id="wpop-2-2"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>What an Eval Harness Actually Does</h3><div class="analogy"><span class="an-lab">In plain words</span>A harness is like a restaurant health inspector's checklist: the inspector (harness) visits every kitchen (model), runs the same tests (scorers) on every dish (response), and files one unified report — you don't write a new checklist per kitchen.</div><p>An <strong>eval harness</strong> is the glue layer inside an <button class="term" data-term="eval-framework">eval framework<span class="i">i</span></button> that connects three things: your <button class="term" data-term="dataset">dataset<span class="i">i</span></button>, your models (via <button class="term" data-term="provider-adapter">provider adapters<span class="i">i</span></button>), and your <button class="term" data-term="scorer">scorers<span class="i">i</span></button>.</p><p>A <button class="term" data-term="provider-adapter">provider adapter<span class="i">i</span></button> is a small configuration block that tells the harness how to call a specific model API — which endpoint, which model name, and which API key to use. Think of it as a plug adaptor: the harness always speaks the same internal language, and the adapter translates that into whatever the model's API expects.</p><p>A <button class="term" data-term="scorer">scorer<span class="i">i</span></button> (also called a metric or assertion checker) is a function that takes the model's response and returns a number or pass/fail verdict. Some scorers are deterministic — they check for an exact string. Others use an LLM judge (a second model call) to rate qualities like <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button> or <button class="term" data-term="answer-relevance">answer relevance<span class="i">i</span></button>.</p><p>The harness loops over every case in the dataset, sends the input to every provider, collects each response, runs every scorer on that response, and writes the results to a report. You configure this loop once; the harness runs it for all 50 × 2 = 100 model calls automatically.</p><ul><li><strong>Dataset</strong> — the 50 JSONL rows you built in Module 2</li><li><strong>Provider adapters</strong> — one block each for GPT-4o and Claude 3.5 Sonnet</li><li><strong>Scorers</strong> — faithfulness and answer-relevance checks declared once, applied to every response</li></ul><div class="keyterms"><button class="term-chip" data-term="eval-framework">Eval Framework<span class="i">i</span></button><button class="term-chip" data-term="provider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="eval-pipeline">Eval Pipeline<span class="i">i</span></button></div></div></template><template id="wpop-2-2-a0"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 1 — promptfoo YAML: Providers + Dataset</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># promptfoo.yaml  — Stage 1: wire providers and dataset</span>
description: Chatbot eval — <span class="tk-n">50</span> cases, <span class="tk-n">2</span> providers

providers:
  - openai:gpt-o-<span class="tk-n">2024</span>-<span class="tk-n">08</span>-<span class="tk-n">06</span>
  - anthropic:claude-<span class="tk-n">3</span>-<span class="tk-n">5</span>-sonnet-<span class="tk-n">20241022</span>

tests: cases.jsonl   <span class="tk-c"># your 50-row dataset from Module 2</span></pre></div><p><button class="term" data-term="provider-adapter">provider adapters<span class="i">i</span></button> to your 50-case <button class="term" data-term="dataset">dataset<span class="i">i</span></button> — no scorers yet, so promptfoo will call both models but not grade anything.</p><p>The strings <code>openai:gpt-4o-2024-08-06</code> and <code>anthropic:claude-3-5-sonnet-20241022</code> are promptfoo's built-in adapter IDs — the prefix before the colon names the API client, and the suffix is the exact model version string.</p><div class="quiz"><div class="q">Predict: If you run `npx promptfoo eval` with only this config (no scorers declared), what will the output report show for each test case?</div><button class="reveal">Reveal</button><div class="answer"><p>The report will show the raw model responses side-by-side for both providers, but every case will show 'no assertions' — there are no pass/fail verdicts yet because no scorers have been declared. You'll see the text outputs but zero grading.</p></div></div></div></div><div class="keyterms"><button class="term-chip" data-term="provider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="eval-framework">Eval Framework<span class="i">i</span></button></div></div></template><template id="wpop-2-2-a1"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 2 — promptfoo YAML: Add Scorers</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># promptfoo.yaml  — Stage 2: add scorers (delta from Stage 1)</span>
description: Chatbot eval — <span class="tk-n">50</span> cases, <span class="tk-n">2</span> providers

providers:
  - openai:gpt-o-<span class="tk-n">2024</span>-<span class="tk-n">08</span>-<span class="tk-n">06</span>
  - anthropic:claude-<span class="tk-n">3</span>-<span class="tk-n">5</span>-sonnet-<span class="tk-n">20241022</span>

tests: cases.jsonl

defaultTest:
  assert:
    - <span class="tk-k">type</span>: llm-rubric          <span class="tk-c"># faithfulness: LLM judge</span>
      value: <span class="tk-s">"Answer is grounded in the provided context."</span>
    - <span class="tk-k">type</span>: similar             <span class="tk-c"># answer relevance: semantic similarity</span>
      value: <span class="tk-s">"{{expected}}"</span>
      threshold: <span class="tk-n">0.75</span></pre></div><p><button class="term" data-term="scorer">scorers<span class="i">i</span></button> block that was missing in Stage 1. <code>defaultTest.assert</code> section applies both checks to every one of the 50 cases automatically.</p><p><code>llm-rubric</code> scorer sends the model's response plus the rubric string to an <button class="term" data-term="llm-judge">LLM judge<span class="i">i</span></button> (a second model call) and gets back a pass/fail for <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button>. <code>similar</code> scorer computes <button class="term" data-term="semantic-similarity">semantic similarity<span class="i">i</span></button> <code>expected</code> field from your dataset row, passing only if the score exceeds 0.75.</p><div class="quiz"><div class="q">Stop — attempt this before revealing. The `similar` scorer uses `{{expected}}` as its value. Where does `expected` come from at runtime, and what happens if a row in cases.jsonl has no `expected` field?

Hint 1: Look at what Module 2 said each dataset row stores.

rovider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button></div></div></template><template id="wpop-2-4"><div class="block reveal"><h3>Build the promptfoo YAML Harness</h3><div class="walk"><div class="step"><div class="n"></div><div><strong>Declare your providers</strong><p>The <strong>providers</strong> section lists every model the harness will call. Each entry is a <button class="term" data-term="provider-adapter">provider adapter<span class="i">i</span></button>: a short ID that tells promptfoo which API to hit and which model name to pass. <code>openai:gpt-4o-2024-08-06</code> and promptfoo handles the HTTP call, authentication, and response parsing for you.</p></div></div><div class="step"><div class="n"></div><div><strong>Point to your dataset file</strong><p>The <strong>tests</strong> key accepts a file path to your JSONL <button class="term" data-term="dataset">dataset<span class="i">i</span></button> — the 50-row file you built in Module 2. promptfoo reads each row as one test case, pulling the <code>input</code>, <code>context</code>, and <code>expected</code> fields automatically.</p></div></div><div class="step"><div class="n"></div><div><strong>Declare your scorers</strong><p>The <strong>defaultTest.assert</strong> block lists the <button class="term" data-term="scorer">scorers<span class="i">i</span></button> that apply to every test case. You declare <code>llm-rubric</code> for faithfulness (an LLM judge checks whether the answer is grounded in the context) and <code>similar</code> for answer relevance (a semantic similarity check against the expected output). Both scorers run automatically on every response from every provider.</p></div></div><div class="step"><div class="n"></div><div><strong>Run the harness</strong><p>From your terminal, run <code>npx promptfoo eval</code> in the directory containing your YAML file. promptfoo loops over all 50 cases, calls both providers, scores every response, and opens a browser report showing pass/fail per case per model. The whole run takes roughly 2–5 minutes for 100 API calls, depending on rate limits.</p></div></div></div><div class="keyterms"><button class="term-chip" data-term="eval-framework">Eval Framework<span class="i">i</span></button><button class="term-chip" data-term="provider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="answer-relevance">Answer Relevance<span class="i">i</span></button></div></div></template><template id="wpop-2-5"><div class="block reveal"><h3>promptfoo vs. DeepEval: Which Fits Your Stack</h3><div class="matrix"><table class="dm"><thead><tr><th>Option</th><th>Config style</th><th>Provider swap effort</th><th>CI integration</th><th>When to choose</th><th>Cost</th><th>Complexity</th></tr></thead><tbody><tr><td><strong>promptfoo (YAML + CLI)</strong></td><td><span class="rate good"></span>Declarative YAML — no code required</td><td><span class="rate good"></span>Change one line in providers list</td><td><span class="rate good"></span>One CLI command; native GitHub Actions step</td><td class="when">Your team already uses YAML-based config (e.g. GitHub Actions, Kubernetes) and you want a zero-Python harness you can run from the command line or a CI step without writing test code.</td><td>API costs only; promptfoo OSS is free</td><td>Low — one YAML file, one CLI command</td></tr><tr><td><strong>DeepEval (pytest + Python SDK)</strong></td><td><span class="rate good"></span>Python code — full language flexibility</td><td><span class="rate ok"></span>Swap the pytest fixture; test logic unchanged</td><td><span class="rate good"></span>Runs as pytest; integrates with any Python CI</td><td class="when">Your team already writes pytest tests and you want eval cases to live alongside unit tests in the same repo, share fixtures, and run in the same CI pipeline.</td><td>API costs only; DeepEval OSS is free (hosted dashboard is paid)</td><td>Medium — requires a Python fixture per provider</td></tr></tbody></table><div class="howread">Pick the row that matches your team's existing workflow. Both tools run the same 50 cases against the same two models — the difference is where you spend your configuration effort.</div></div><div class="keyterms"><button class="term-chip" data-term="eval-framework">Eval Framework<span class="i">i</span></button><button class="term-chip" data-term="provider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="ci-gate">CI Gate<span class="i">i</span></button></div></div></template><template id="wpop-2-6"><div class="block reveal"><h3>How This Breaks — and How to Verify AI-Generated Configs</h3><div class="callout warn"><h4>Common failure modes</h4><ul><li><strong>Wrong model version string.</strong> Using <code>gpt-4o</code> instead of <code>gpt-4o-2024-08-06</code> silently routes to a different model snapshot — your results are not reproducible and you may not notice. Observable symptom: scores drift between runs with identical inputs.</li><li><strong>Dataset field name mismatch.</strong> If your JSONL rows use <code>"query"</code> but the config expects <code>"input"</code>, the harness substitutes an empty string — every case passes trivially or fails with a nonsense score. Observable symptom: all 50 cases pass with a perfect score on the first run (a red flag, not a win).</li><li><strong>Scorer threshold set to 0.0.</strong> A threshold of 0.0 means every response passes the similarity check regardless of quality — a silent failure that makes your eval useless. Observable symptom: 100% pass rate even when you deliberately send a nonsense answer.</li><li><strong>Missing context field breaks faithfulness.</strong> The faithfulness scorer needs the retrieved context to judge grounding; if <code>retrieval_context</code> is empty, the LLM judge has nothing to compare against and may hallucinate a verdict. Observable symptom: faithfulness scores are randomly high or low with no correlation to actual answer quality.</li></ul><h4>Verify an AI-generated harness config</h4><ol><li>Check the provider strings match the exact versioned model IDs (<code>gpt-4o-2024-08-06</code>, <code>claude-3-5-sonnet-20241022</code>) — not aliases like <code>gpt-4o-latest</code>.</li><li>Open one row of your JSONL file and confirm every field name the config references (<code>input</code>, <code>context</code>, <code>expected</code>) actually exists in that row.</li><li>Check that every scorer has a threshold above 0.0 — a generated config often defaults to 0 as a placeholder.</li><li>Run the harness on <strong>three cases only</strong> first (slice the dataset) and manually read the responses — if all three pass instantly, something is wired wrong.</li></ol></div><div class="keyterms"><button class="term-chip" data-term="provider-adapter">Provider Adapter<span class="i">i</span></button><button class="term-chip" data-term="scorer">Scorer<span class="i">i</span></button><button class="term-chip" data-term="dataset">Dataset<span class="i">i</span></button><button class="term-chip" data-term="faithfulness">Faithfulness<span class="i">i</span></button><button class="term-chip" data-term="hallucination">Hallucination<span class="i">i</span></button></div></div></template><template id="wpop-3-0"><p>Run the 50-case chatbot suite locally with the promptfoo CLI and the DeepEval pytest command, then read the pass/fail table, score distributions, and per-case trace output — ="369.9" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#ffffff"><tspan x="231.5" dy="0">Gate CI</tspan></text><text x="231.5" y="400.2" text-anchor="middle" class="sub" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.86"><tspan x="231.5" dy="0">block regressions</tspan></text></g><text x="500" y="842" text-anchor="middle" class="caption" font-size="15" font-weight="600" fill="#475467">score prompts on every change</text><rect x="60" y="854" width="880" height="70" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="60" y="854" width="6" height="70" rx="3" fill="#4f46e5"/><text x="82" y="880" text-anchor="start" class="tag" font-size="11" font-weight="800" fill="#3730a3" letter-spacing="0.8" style="text-transform:uppercase">EXAMPLE</text><text x="82" y="906" text-anchor="start" class="example-text" font-size="15" font-weight="600" fill="#344054"><tspan x="82" dy="0">Promptfoo runs 50 cases across GPT-4o vs Claude; Ragas scores RAG faithfulness in CI.</tspan></text></svg></div></template><template id="wpop-3-1"><div class="block reveal needs-conceptual b-concept blk-explain"><h3>Recap: What the Harness Built</h3><div class="analogy"><span class="an-lab">In plain words</span>The harness is like a car on a dynamometer — all the machinery is connected, but the engine doesn't run until a technician hits 'start' and reads the gauges.</div><div class="callout info">Before reading on, predict from memory: in module 3 you wired up an eval harness. Name the three moving parts it connects — the thing that holds your test cases, the thing that calls the model, and the thing that scores the output.</div><p>Module 3 gave you a working <button class="term" data-term="eval-framework">eval harness<span class="i">i</span></button>: a <button class="term" data-term="dataset">dataset<span class="i">i</span></button> of 50 chatbot test cases, a <button class="term" data-term="provider-adapter">provider adapter<span class="i">i</span></button> that routes each case to the model, and a <button class="term" data-term="scorer">scorer<span class="i">i</span></button> that judges the output.</p><p>Those three parts sit idle until you pull the trigger — and that is exactly what this module covers.</p><p>Right now, your 50-case suite is a loaded test bench with no one pressing the button.</p><p>This module answers: how do you fire the suite with a single command, and what do you do with the wall of numbers it spits back?</p></div></template><template id="wpop-3-2"><div class="block reveal needs-technical blk-explain"><h3>One Command Fires the Full Suite</h3><div class="analogy"><span class="an-lab">In plain words</span>Running the suite is like pressing 'run all tests' in a code editor — one button, every check, one summary at the end.</div><p>Both promptfoo and DeepEval run all 50 cases with a single terminal command.</p><p>In <strong>promptfoo</strong> (a declarative, config-file-driven <button class="term" data-term="eval-framework">eval framework<span class="i">i</span></button>), run <code>promptfoo eval</code> from the folder holding your <code>promptfooconfig.yaml</code> file.</p><p>promptfoo reads the config and calls each model for every test case. It runs every <button class="term" data-term="assertion">assertion<span class="i">i</span></button> and writes a report in one shot.</p><p>In <strong>DeepEval</strong> (a Python-native framework like unit tests), run <code>deepeval test run test_chatbot.py</code>. It wraps pytest, so output looks like a familiar test report.</p><p>Both commands block until every case finishes. Then they print a summary table: pass count, fail count, and overall score.</p><p>Key difference: promptfoo's report opens in a browser for side-by-side model comparison. DeepEval's output stays in the terminal and integrates with pytest.</p></div></template><template id="wpop-3-2-a0"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 1: Fire the Suite, See Raw Output</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># From your project folder (where promptfooconfig.yaml lives)</span>
promptfoo eval

<span class="tk-c"># --- Terminal output (truncated) ---</span>
Running <span class="tk-n">50</span> test cases across <span class="tk-n">2</span> providers...
[gpt-o]        <span class="tk-k">case</span> <span class="tk-n">01</span> <span class="tk-k">PASS</span>  (faithfulness: <span class="tk-n">0.91</span>)
[claude-<span class="tk-n">3</span>-<span class="tk-n">5</span>]    <span class="tk-k">case</span> <span class="tk-n">01</span> <span class="tk-k">PASS</span>  (faithfulness: <span class="tk-n">0.88</span>)
[gpt-o]        <span class="tk-k">case</span> <span class="tk-n">07</span> <span class="tk-f">FAIL</span>  (faithfulness: <span class="tk-n">0.41</span> &lt; threshold <span class="tk-n">0.70</span>)
[claude-<span class="tk-n">3</span>-<span class="tk-n">5</span>]    <span class="tk-k">case</span> <span class="tk-n">07</span> <span class="tk-k">PASS</span>  (faithfulness: <span class="tk-n">0.73</span>)
...
Done. Results saved to .promptfoo/output.json
Open report: promptfoo view</pre></div><p>This is the exact terminal session you will see when you run the suite for the first time.</p><p>Each line shows the provider (the model being tested), the case number, PASS or FAIL, the metric name, the numeric score, and — on a FAIL — the <button class="term" data-term="threshold">threshold<span class="i">i</span></button> it missed.</p><div class="quiz"><div class="q">Predict: Look at case 07 above. GPT-4o scores 0.41 on faithfulness and Claude 3.5 scores 0.73. The threshold is 0.70. Before reading on — which model fails case 07, and what does that tell you about its answer?</div><button class="reveal">Reveal</button><div class="answer"><p>GPT-4o fails case 07 because 0.41 &lt; 0.70. A low faithfulness score means the model's answer contained claims that were NOT supported by the retrieved chunk — in other words, it made something up (hallucinated). Claude 3.5 just clears the bar at 0.73, so it passes. This is the first signal that GPT-4o may struggle with a specific intent category.</p></div></div></div></div></div></template><template id="wpop-3-2-a1"><div class="block reveal needs-functional b-funcex blk-example"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">💡</span><span class="col-lab">Reading the Pass/Fail Table and Score Distribution</span><span class="col-chev">▸</span></button><div class="collapse-body"><p>After <code>promptfoo view</code> opens in your browser, you see three panels.</p><h4>Panel 1 — The Pass/Fail Table</h4><p>Each row is one test case; columns are the models you tested.</p><p>Green means the case passed every <button class="term" data-term="assertion">assertion<span class="i">i</span></button>. Red means at least one assertion fell below its <button class="term" data-term="threshold">threshold<span class="i">i</span></button>.</p><p>Scan red cells column by column. If one model has red in all 'refund-intent' rows, it's systematically failing that category.</p><h4>Panel 2 — The Score Distribution</h4><p>The <button class="term" data-term="score-distribution">score distribution<span class="i">i</span></button> is a histogram showing how many cases landed in each score range.</p><p>A healthy suite bunches most cases near 1.0 with a thin tail near 0.</p><p>A fat bar in the 0.4–0.6 range is a warning: many cases are borderline. A small prompt change could flip them from pass to fail.</p><h4>Panel 3 — The Diff View</h4><p>The <button class="term" data-term="diff-view">diff view<span class="i">i</span></button> places GPT-4o and Claude 3.5 Sonnet side-by-side for every case.</p><p>Look for cases where one model's answer is short and hedged while the other's is long and specific. That gap often reveals which model is <button class="term" data-term="hallucination">hallucinating<span class="i">i</span></button>.</p></div></div></div></template><template id="wpop-3-2-a2"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Stage 2: Open a Per-Case Trace</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-c"># DeepEval prints a per-case trace when a test fails.</span>
<span class="tk-c"># Click the failing case in the report, or read the terminal block:</span>

<span class="tk-c"># --- Trace for case 07 (GPT-4o, FAIL) ---</span>
<span class="tk-c"># input:           "Can I get a refund after 30 days?"</span>
<span class="tk-c"># retrieved_chunk: "Refunds are accepted within 30 days of purchase."</span>
<span class="tk-c"># model_output:    "Yes, refunds are available up to 60 days after purchase."</span>
<span class="tk-c"># scorer:          faithfulness</span>
<span class="tk-c"># score:           0.41</span>
<span class="tk-c"># scorer_reasoning: "Output claims 60-day window; chunk states 30-day window only."</span></pre></div><p>A <button class="term" data-term="trace">trace<span class="i">i</span></button> is the full paper trail for one test case — every field the eval pipeline recorded, from the user's question to the scorer's verdict.</p><p>Reading the trace for case 07 makes the failure concrete: the model said '60 days' when the retrieved chunk clearly says '30 days' — a textbook <button class="term" data-term="hallucination">hallucination<span class="i">i</span></button> that the <button class="term" data-term="faithfulness">faithfulness<span class="i">i</span></button> scorer caught.</p><div class="quiz"><div class="q">Predict: Look at the trace above. The scorer_reasoning says the output 'claims 60-day window; chunk states 30-day window only.' Before reading on — which field in the trace would you check FIRST to decide whether this is a retrieval problem or a model problem, and why?</div><button class="reveal">Reveal</button><div class="answer"><p>Check 'retrieved_chunk' first. If the chunk already contains the correct '30-day' information (it does here), the retrieval step worked fine — the model ignored the chunk and invented '60 days'. That makes it a model/prompt problem, not a retrieval problem. If the chunk had been wrong or empty, you would fix retrieval first.</p></div></div></div></div></div></template><template id="wpop-3-2-a3"><div class="block reveal needs-code b-code blk-code"><div class="collapse"><button class="collapse-h" aria-expanded="false"><span class="col-ico">⟨⟩</span><span class="col-lab">Practice: Filter the Diff by Intent Category</span><span class="col-chev">▸</span></button><div class="collapse-body"><div class="ex"><button class="copy">Copy</button><pre class="code"><span class="tk-k">import</span> json

<span class="tk-k">with</span> <span class="tk-f">open</span>(<span class="tk-s">".promptfoo/output.json"</span>) <span class="tk-k">as</span> f:
    results = json.<span class="tk-f">load</span>(f)[<span class="tk-s">"results"</span>]

target_intent = <span class="tk-s">"refund-intent"</span>
gpt4o_fails, claude_fails = [], []

<span class="tk-k">for</span> <span class="tk-k">case</span> <span class="tk-k">in</span> results:
    <span class="tk-k">if</span> <span class="tk-k">case</span>[<span class="tk-s">"vars"</span>].<span class="tk-f">get</span>(<span class="tk-s">"intent"</span>) != target_intent:
        <span class="tk-k">continue</span>
    <span class="tk-k">for</span> result <span class="tk-k">in</span> <span class="tk-k">case</span>[<span class="tk-s">"providerResults"</span>]:
        passed = result[<span class="tk-s">"pass"</span>]
        name   = result[<span class="tk-s">"provider"</span>]
        <span class="tk-c"># TODO: append the case to gpt4o_fails or claude_fails</span>
        <span class="tk-c">#       based on `name` and `passed`</span>

<span class="tk-k">print</span>(f<span class="tk-s">"GPT-4o fails:    {len(gpt4o_fails)}"</span>)
<span class="tk-k">print</span>(f<span class="tk-s">"Claude 3.5 fails: {len(claude_fails)}"</span>)</pre></div><p>This script loads the promptfoo output file and filters down to only the 'refund-intent' cases — the intent category where case 07 failed.</p><p>Your job is to fill in the TODO: route each failing result into the right list so the final print shows which model struggles more with refund questions.</p><div class="quiz"><div class="q">Stop — attempt the TODO before revealing.
Hint 1: `name` will be a string like 'openai:gpt-4o' or 'anthropic:claude-3-5-sonnet'.
Hint 2: you want to append only when `passed` is False.
What two lines replace the TODO, and what output do you expect if GPT-4o fails 8 of the refund cases and Claude fails 3?</div><button class="reveal">Reveal</button><div class="answer"><p># CHANGED LINES (the two that replace the TODO):</p><p>if not passed and 'gpt-4o' in name:</p><p>gpt4o_fails.append(case)</p><p>elif not passed and 'claude' in name:</p><p>claude_fails.append(case)</p><p># Expected output:</p><p># GPT-4o fails:     8</p><p># Claude 3.5 fails: 3</p><p># Why: you check <code>not passed</code> first (only failures), then route by provider name.</p><p># The diff view in the browser already shows this visually — this script lets you</p><p># export the numbers for a report or a CI gate check in the next module.</p></div></div></div></div></div></template><template id="wpop-3-3"><div class="block reveal"><h3>What a Score Distribution Tells You</h3><div class="viz" data-viz="slider"><p class="viz-cap">Drag the slider to see what each score cluster means for your 50-case chatbot suite.</p><div class="viz-body"></div><script type="application/json" class="viz-data">{"min":0,"max":1,"unit":"faithfulness score","stops":[{"at":0.2,"label":"Mostly failing","note":"Most cases score below 0.3 — the model is consistently hallucinating or ignoring the retrieved chunk. Investigate your prompt and retrieval pipeline before anything else."},{"at":0.5,"label":"Borderline cluster","note":"Many cases land in the 0.4–0.6 band — scores are unstable. A small prompt tweak or a different retrieved chunk could flip these either way. Treat this as a red flag."},{"at":0.7,"label":"Near the threshold","note":"Cases cluster just above the 0.70 pass threshold. The suite is passing, but barely — any regression will push cases below the line. Raise the threshold or improve the prompt."},{"at":0.9,"label":"Healthy distribution","note":"Most cases score 0.85–1.0 with a thin low-score tail. This is the target shape: confident passes, and the few failures are easy to isolate and fix."}]}</script></div></div></template><template id="wpop-3-4"><div class="block reveal"><h3>How Running Evals Breaks in Practice</h3><div class="callout warn"><p>These are three common ways a local eval run misleads you.</p><ul><li>Silent API timeout — a case returns an empty string instead of an error. The scorer grades the empty string and often gives a low score. The case shows as FAIL rather than ERROR. Symptom: a cluster of cases with identical low scores. Open their traces and check that <code>model_output</code> is not blank.</li><li>Threshold set too low — every case passes and the report is all green. But if your <button class="term" data-term="threshold">threshold<span class="i">i</span></button> is 0.40 and real harm starts at 0.70, the green table is false. Always check the score distribution: healthy suites have most scores above 0.85.</li><li>Diff view shows one model always winning — but only because it writes longer answers. Some <button class="term" data-term="rubric-judge">rubric judges<span class="i">i</span></button> reward verbosity. Filter the diff to cases where the shorter model failed. If its answers are correct but terse, your scorer is biased, not the model.</li></ul><p>Quick verify checklist: (1) open three random failing traces and confirm <code>model_output</code> is non-empty; (2) check that the threshold matches your intent, not a default; (3) run one known-good case manually and confirm it scores above 0.85.</p></div></div></template><template id="wpop-4-0"><p>Add an eval step to a GitHub Actions workflow that installs dependencies, runs the 50-case chatbot suite, and fails the build if overall accuracy drops below 85% or faithfulness drops below 0.8 — with environment variable handling for API keys and dataset caching to keep costs predictable.</p><p>This module shows you how to add your eval suite as a required step in a GitHub Actions CI pipeline, so every pull request is automatically quality-checked before it can be merged.</p><div class="po-analogy"><b>In plain words —</b> A CI gate is like a bouncer at the door: if your score is too low, the code doesn't get in.</div><p><b>Why this matters:</b> Without a CI gate, eval quality checks only happen when someone remembers to run them — this module makes quality enforcement automatic and team-wide.</p><h4>After this you'll be able to</h4><ul><li>After this you'll be able to write a GitHub Actions workflow YAML that runs your eval suite as a required CI step.</li><li>After this you'll be able to set accuracy and faithfulness thresholds that block a merge when scores drop below them.</li><li>After this you'll be able to store API keys safely as GitHub secrets and cache the dataset to avoid redundant API calls.</li></ul><h4>Eval Frameworks: Promptfoo, DeepEval, Ragas</h4><div class="po-visual"><svg class="viz-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eval Frameworks: Promptfoo, DeepEval, Ragas" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>.viz-svg{color-scheme: light;
